<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Radar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        /* ── Theme Variables ─────────────────────────── */
        [data-theme="dark"] {
            --bg-primary: #0f1117; --bg-secondary: #1a1d27; --bg-card: #1e2130;
            --bg-card-hover: #252840; --border: #2a2d3e;
            --text-primary: #e4e6f0; --text-secondary: #8b8fa3; --text-muted: #5c6078;
        }
        [data-theme="light"] {
            --bg-primary: #f5f6fa; --bg-secondary: #ffffff; --bg-card: #ffffff;
            --bg-card-hover: #f0f1f5; --border: #e0e2ea;
            --text-primary: #1a1d27; --text-secondary: #5c6078; --text-muted: #8b8fa3;
        }
        [data-theme="contrast"] {
            --bg-primary: #000000; --bg-secondary: #111111; --bg-card: #1a1a1a;
            --bg-card-hover: #222222; --border: #444444;
            --text-primary: #ffffff; --text-secondary: #cccccc; --text-muted: #888888;
        }
        :root {
            --accent-blue: #4f8ff7; --accent-purple: #a855f7; --accent-green: #22c55e;
            --accent-orange: #f59e0b; --accent-red: #ef4444; --accent-cyan: #06b6d4;
            --accent-pink: #ec4899; --accent-indigo: #6366f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

        /* ── Header ──────────────────────────────────── */
        .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .header-meta { font-size: 12px; color: var(--text-muted); margin-right: 8px; }

        /* ── Buttons ─────────────────────────────────── */
        .btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px; }
        .btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .btn-primary:hover { opacity: 0.85; }
        .btn.active { border-color: var(--accent-blue); color: var(--accent-blue); }

        /* ── Date inputs ─────────────────────────────── */
        .date-input { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 5px 8px; border-radius: 6px; font-size: 12px; }
        .date-input:focus { border-color: var(--accent-blue); outline: none; }

        /* ── Tabs ────────────────────────────────────── */
        .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 24px; background: var(--bg-secondary); }
        .tab { padding: 10px 18px; font-size: 13px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab:hover { color: var(--text-primary); }
        .tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Container ───────────────────────────────── */
        .container { max-width: 1600px; margin: 0 auto; padding: 20px 24px; }

        /* ── KPI Grid ────────────────────────────────── */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; transition: all 0.2s; }
        .kpi-card:hover { border-color: var(--accent-blue); transform: translateY(-1px); }
        .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
        .kpi-value { font-size: 24px; font-weight: 700; line-height: 1.2; }
        .kpi-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .kpi-value.blue { color: var(--accent-blue); } .kpi-value.purple { color: var(--accent-purple); }
        .kpi-value.green { color: var(--accent-green); } .kpi-value.orange { color: var(--accent-orange); }
        .kpi-value.red { color: var(--accent-red); } .kpi-value.cyan { color: var(--accent-cyan); }

        /* ── Charts ──────────────────────────────────── */
        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 12px; }
        .grid-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
        .chart-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); }
        .chart-container { position: relative; width: 100%; }
        .chart-container.tall { height: 280px; } .chart-container.medium { height: 220px; }
        .full-width { grid-column: 1 / -1; }

        /* ── Tables ──────────────────────────────────── */
        .table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; overflow-x: auto; }
        .table-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; }
        th:hover { color: var(--text-secondary); }
        th.sort-asc::after { content: ' ▲'; } th.sort-desc::after { content: ' ▼'; }
        td { padding: 10px; border-bottom: 1px solid rgba(42,45,62,0.3); font-size: 12px; }
        tr:hover td { background: rgba(79,143,247,0.04); }
        .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; }
        .text-right { text-align: right; }
        .project-name { font-weight: 600; color: var(--accent-blue); }
        .project-path { font-size: 10px; color: var(--text-muted); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cost-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 50px; }
        .cost-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); }
        .clickable { cursor: pointer; }
        .clickable:hover { text-decoration: underline; }

        /* ── Git badges ─────────────────────────────────── */
        .commit-hash { font-family: 'SF Mono','Fira Code',monospace; font-size: 11px; color: var(--accent-orange); }
        .branch-badge { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; background: rgba(168,85,247,0.12); color: var(--accent-purple); }
        .lines-added { color: var(--accent-green); } .lines-deleted { color: var(--accent-red); }

        /* ── Insights ────────────────────────────────── */
        .insight { padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid; }
        .insight.warning { background: rgba(245,158,11,0.08); border-color: var(--accent-orange); }
        .insight.info { background: rgba(79,143,247,0.06); border-color: var(--accent-blue); }
        .insight-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .insight-detail { font-size: 12px; color: var(--text-secondary); }

        /* ── Session Detail ──────────────────────────── */
        .session-detail { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
        .msg-timeline { max-height: 500px; overflow-y: auto; }
        .msg-item { padding: 8px 12px; border-left: 2px solid var(--border); margin-left: 8px; margin-bottom: 4px; font-size: 12px; }
        .msg-item.user { border-color: var(--accent-blue); }
        .msg-item.assistant { border-color: var(--accent-purple); }
        .msg-meta { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
        .msg-preview { color: var(--text-secondary); word-break: break-word; }
        .back-btn { margin-bottom: 16px; }

        /* ── Modal ───────────────────────────────────── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; width: 400px; max-width: 90vw; }
        .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .modal label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 4px; }
        .modal select, .modal input { width: 100%; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text-primary); font-size: 13px; margin-bottom: 12px; outline: none; }
        .modal select:focus, .modal input:focus { border-color: var(--accent-blue); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

        /* ── Toast ───────────────────────────────────── */
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--accent-green); color: var(--text-primary); padding: 10px 16px; border-radius: 8px; font-size: 12px; z-index: 1001; opacity: 0; transform: translateY(10px); transition: all 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* ── Live indicator ──────────────────────────── */
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); display: inline-block; margin-right: 4px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ── Loading ─────────────────────────────────── */
        .loading { display: flex; justify-content: center; align-items: center; height: 300px; color: var(--text-muted); }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Responsive ──────────────────────────────── */
        @media (max-width: 1200px) { .grid-2, .grid-eq, .grid-3 { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .container { padding: 12px; } .header { padding: 12px; } .tabs { padding: 0 12px; overflow-x: auto; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Claude Radar</h1>
        <div class="header-controls">
            <span class="header-meta" id="header-meta"></span>
            <input type="date" class="date-input" id="start-date" title="Start date">
            <input type="date" class="date-input" id="end-date" title="End date">
            <button class="btn" onclick="applyDateFilter()">Filter</button>
            <button class="btn" onclick="clearDateFilter()">Clear</button>
            <span style="width:1px; height:20px; background:var(--border); margin:0 4px;"></span>
            <button class="btn" id="btn-regen" onclick="regenerate()">&#x21bb; Refresh</button>
            <button class="btn" onclick="exportData('json')">JSON</button>
            <button class="btn" onclick="exportData('csv')">CSV</button>
            <button class="btn" onclick="generateReport()">Report</button>
            <button class="btn" onclick="requestNotifications()" title="Enable browser notifications">&#x1F514;</button>
            <button class="btn" onclick="openSettings()">&#x2699;</button>
            <select class="date-input" id="theme-select" onchange="setTheme(this.value)" style="width:auto">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="contrast">Contrast</option>
            </select>
        </div>
    </div>

    <div class="tabs" id="main-tabs">
        <div class="tab active" data-tab="overview">Overview</div>
        <div class="tab" data-tab="sessions">Sessions</div>
        <div class="tab" data-tab="tools">Tools & Skills</div>
        <div class="tab" data-tab="git">Git Costs</div>
        <div class="tab" data-tab="insights">Insights</div>
    </div>

    <!-- OVERVIEW TAB -->
    <div class="tab-content active" id="tab-overview">
        <div class="container" id="overview-app">
            <div class="loading"><div class="spinner"></div>Loading...</div>
        </div>
    </div>

    <!-- SESSIONS TAB -->
    <div class="tab-content" id="tab-sessions">
        <div class="container" id="sessions-app"></div>
    </div>

    <!-- TOOLS TAB -->
    <div class="tab-content" id="tab-tools">
        <div class="container" id="tools-app"></div>
    </div>

    <!-- GIT TAB -->
    <div class="tab-content" id="tab-git">
        <div class="container" id="git-app"></div>
    </div>

    <!-- INSIGHTS TAB -->
    <div class="tab-content" id="tab-insights">
        <div class="container" id="insights-app"></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Settings</h2>
            <label>Subscription Plan</label>
            <select id="setting-plan" onchange="toggleCustomRate()">
                <option value="pro_20">Pro - $20/month</option>
                <option value="max_100">Max - $100/month</option>
                <option value="max_200">Max - $200/month</option>
                <option value="team">Team - Custom rate</option>
            </select>
            <div id="custom-rate-row" style="display:none">
                <label>Custom Monthly Rate ($)</label>
                <input type="number" id="setting-rate" placeholder="e.g. 150" />
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

<script>
// ── Globals ──────────────────────────────────────
const COLORS = { blue:'#4f8ff7', purple:'#a855f7', green:'#22c55e', orange:'#f59e0b', red:'#ef4444', cyan:'#06b6d4', pink:'#ec4899', indigo:'#6366f1', lime:'#84cc16', amber:'#d97706', teal:'#14b8a6', rose:'#f43f5e' };
const PALETTE = Object.values(COLORS);
const PLAN_RATES = { pro_20:20, max_100:100, max_200:200 };
let currentData = null;
let charts = {};
let dateFilter = {};

// ── Formatters ───────────────────────────────────
function fmt(n,d=0){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toFixed(d);}
function fmtCost(n){return'$'+n.toFixed(2);}
function fmtTokens(n){if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toString();}
function fmtDate(s){return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDateTime(s){if(!s)return'-';return new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}

// ── Chart defaults ───────────────────────────────
Chart.defaults.color='#8b8fa3';Chart.defaults.borderColor='rgba(42,45,62,0.5)';
Chart.defaults.font.family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif";
Chart.defaults.font.size=11;Chart.defaults.plugins.legend.labels.usePointStyle=true;
Chart.defaults.plugins.legend.labels.pointStyleWidth=8;Chart.defaults.plugins.legend.labels.padding=12;

// ── Tabs ─────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'sessions' && currentData) renderSessions();
        if (tab.dataset.tab === 'tools' && currentData) renderTools();
        if (tab.dataset.tab === 'git') renderGit();
        if (tab.dataset.tab === 'insights') renderInsights();
    });
});

// ── Theme ────────────────────────────────────────
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('radar-theme', t); }
const saved = localStorage.getItem('radar-theme'); if (saved) { setTheme(saved); document.getElementById('theme-select').value = saved; }

// ── Date Filter ──────────────────────────────────
function applyDateFilter() { dateFilter.startDate = document.getElementById('start-date').value || undefined; dateFilter.endDate = document.getElementById('end-date').value || undefined; loadAndRender(); }
function clearDateFilter() { dateFilter = {}; document.getElementById('start-date').value = ''; document.getElementById('end-date').value = ''; loadAndRender(); }

// ── Toast / Settings ─────────────────────────────
function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
async function openSettings() { const r=await fetch('/api/config'); const{config}=await r.json(); document.getElementById('setting-plan').value=config.plan||'max_100'; document.getElementById('setting-rate').value=config.monthlyRate||''; toggleCustomRate(); document.getElementById('settings-modal').classList.add('open'); }
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }
function toggleCustomRate() { document.getElementById('custom-rate-row').style.display=document.getElementById('setting-plan').value==='team'?'block':'none'; }
document.getElementById('settings-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSettings();});
async function saveSettings() { const plan=document.getElementById('setting-plan').value; const rate=plan==='team'?parseFloat(document.getElementById('setting-rate').value)||0:PLAN_RATES[plan]||100; await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,monthlyRate:rate})}); closeSettings(); showToast('Saved'); loadAndRender(); }

// ── Export ────────────────────────────────────────
function exportData(format) {
    const params = new URLSearchParams(dateFilter);
    window.open('/api/export/' + format + '?' + params.toString());
}

// ── Regenerate ───────────────────────────────────
async function regenerate() { const btn=document.getElementById('btn-regen'); btn.disabled=true; try{ await fetch('/api/regenerate',{method:'POST'}); await loadAndRender(); showToast('Refreshed'); }finally{btn.disabled=false;} }

// ── Data Loading ─────────────────────────────────
async function loadData() {
    const params = new URLSearchParams(dateFilter);
    const r = await fetch('/api/data?' + params.toString());
    return r.json();
}

async function loadAndRender() {
    currentData = await loadData();
    renderOverview(currentData);
}

// ── Destroy old charts ───────────────────────────
function destroyCharts() { Object.values(charts).forEach(c => c.destroy()); charts = {}; }

// ── OVERVIEW TAB ─────────────────────────────────
function renderOverview(data) {
    destroyCharts();
    const app = document.getElementById('overview-app');
    const s = data.summary;
    const sub = data.subscription || {plan:'Max',monthlyRate:100,monthsActive:1,actualCost:100};
    const apiVal = s.apiEquivalentCost || 0;
    const roi = sub.actualCost > 0 ? (apiVal / sub.actualCost) : 0;
    const cacheEff = s.totalTokens > 0 ? ((s.totalCacheRead / s.totalTokens)*100).toFixed(1) : 0;

    document.getElementById('header-meta').innerHTML = `<span class="live-dot"></span>Live` +
        (s.firstSessionDate ? ` &middot; Since ${fmtDate(s.firstSessionDate)}` : '');

    app.innerHTML = `
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-label">Actual Cost (${sub.plan})</div><div class="kpi-value green">${fmtCost(sub.actualCost)}</div><div class="kpi-sub">${fmtCost(sub.monthlyRate)}/mo &times; ${sub.monthsActive}mo</div></div>
            <div class="kpi-card"><div class="kpi-label">API Equivalent</div><div class="kpi-value blue">${fmtCost(apiVal)}</div><div class="kpi-sub">${fmtCost(s.totalMessages>0?apiVal/s.totalMessages:0)}/msg</div></div>
            <div class="kpi-card"><div class="kpi-label">ROI</div><div class="kpi-value purple">${roi.toFixed(1)}x</div><div class="kpi-sub">value vs paid</div></div>
            <div class="kpi-card"><div class="kpi-label">Tokens</div><div class="kpi-value cyan">${fmtTokens(s.totalTokens)}</div><div class="kpi-sub">${fmtTokens(s.totalInputTokens)} in / ${fmtTokens(s.totalOutputTokens)} out</div></div>
            <div class="kpi-card"><div class="kpi-label">Messages</div><div class="kpi-value orange">${fmt(s.totalMessages)}</div><div class="kpi-sub">${s.totalProjects} projects &middot; ${s.totalSessions} sessions</div></div>
            <div class="kpi-card"><div class="kpi-label">Cache Efficiency</div><div class="kpi-value green">${cacheEff}%</div><div class="kpi-sub">${fmtTokens(s.totalCacheRead)} reads</div></div>
            <div class="kpi-card"><div class="kpi-label">Active Days</div><div class="kpi-value orange">${data.dailyUsage.length}</div><div class="kpi-sub">${fmtCost(sub.actualCost/Math.max(data.dailyUsage.length,1))}/day actual</div></div>
        </div>
        <div class="grid-2">
            <div class="chart-card"><h3>Daily API Value</h3><div class="chart-container tall"><canvas id="c-daily-cost"></canvas></div></div>
            <div class="chart-card"><h3>Value by Project</h3><div class="chart-container tall"><canvas id="c-project-pie"></canvas></div></div>
        </div>
        <div class="grid-eq">
            <div class="chart-card"><h3>Daily Tokens (Input vs Output)</h3><div class="chart-container tall"><canvas id="c-daily-tokens"></canvas></div></div>
            <div class="chart-card"><h3>Model Distribution</h3><div class="chart-container tall"><canvas id="c-model-dist"></canvas></div></div>
        </div>
        <div class="grid-3">
            <div class="chart-card"><h3>Cache Read vs Write</h3><div class="chart-container medium"><canvas id="c-cache"></canvas></div></div>
            <div class="chart-card"><h3>Messages Per Day</h3><div class="chart-container medium"><canvas id="c-msgs-day"></canvas></div></div>
            <div class="chart-card"><h3>Cost Per Model</h3><div class="chart-container medium"><canvas id="c-model-cost"></canvas></div></div>
        </div>
        <div class="grid-2">
            <div class="chart-card full-width"><h3>Daily Tokens by Project</h3><div class="chart-container" style="height:${Math.max(280,data.projects.length*12)}px"><canvas id="c-proj-daily"></canvas></div></div>
        </div>
        <div class="grid-2">
            <div class="chart-card full-width"><h3>API Value by Project</h3><div class="chart-container" style="height:${Math.max(250,data.projects.length*28)}px"><canvas id="c-proj-bar"></canvas></div></div>
        </div>
        <div class="grid-2">
            <div class="chart-card full-width"><h3>Cumulative API Value</h3><div class="chart-container tall"><canvas id="c-cumulative"></canvas></div></div>
        </div>
        <div class="table-card"><h3>Project Breakdown</h3>
            <table><thead><tr>
                <th>Project</th><th class="text-right">API Value</th><th class="text-right">Messages</th>
                <th class="text-right">Sessions</th><th class="text-right">Input</th><th class="text-right">Output</th>
                <th class="text-right">Cache Read</th><th class="text-right">Cache Write</th>
                <th class="text-right" style="min-width:100px">Share</th><th class="text-right">Last Active</th>
            </tr></thead><tbody id="proj-tbody"></tbody></table>
        </div>
        <div class="table-card"><h3>Model Breakdown</h3>
            <table><thead><tr>
                <th>Model</th><th class="text-right">Messages</th><th class="text-right">Input</th>
                <th class="text-right">Output</th><th class="text-right">Cache Read</th>
                <th class="text-right">Cache Write</th><th class="text-right">API Value</th><th class="text-right">Share</th>
            </tr></thead><tbody id="model-tbody"></tbody></table>
        </div>`;

    // Render all charts
    const dl = data.dailyUsage; const p = data.projects; const mu = data.modelUsage;
    const dates = dl.map(d=>fmtDate(d.date));

    // Daily cost bar
    charts.dailyCost = new Chart(el('c-daily-cost'),{type:'bar',data:{labels:dates,datasets:[{label:'API Value ($)',data:dl.map(d=>d.cost),backgroundColor:COLORS.blue+'99',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtCost(c.parsed.y)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:'rgba(42,45,62,0.3)'}},x:{grid:{display:false}}}}});

    // Project pie
    const top8=p.slice(0,8); const otherCost=p.slice(8).reduce((s,x)=>s+x.totalCost,0);
    const pieLabels=[...top8.map(x=>x.name)]; const pieData=[...top8.map(x=>x.totalCost)];
    if(otherCost>0){pieLabels.push('Others');pieData.push(otherCost);}
    charts.projPie = new Chart(el('c-project-pie'),{type:'doughnut',data:{labels:pieLabels,datasets:[{data:pieData,backgroundColor:PALETTE.slice(0,pieLabels.length),borderColor:getComputedStyle(document.body).getPropertyValue('--bg-card').trim(),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}},tooltip:{callbacks:{label:c=>`${c.label}: ${fmtCost(c.parsed)} (${(c.parsed/apiVal*100).toFixed(1)}%)`}}}}});

    // Daily tokens stacked
    charts.dailyTokens = new Chart(el('c-daily-tokens'),{type:'bar',data:{labels:dates,datasets:[{label:'Input',data:dl.map(d=>d.inputTokens),backgroundColor:COLORS.blue+'99',stack:'s'},{label:'Output',data:dl.map(d=>d.outputTokens),backgroundColor:COLORS.purple+'99',stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:'rgba(42,45,62,0.3)'}},x:{stacked:true,grid:{display:false}}}}});

    // Model distribution
    const models=Object.entries(mu).filter(([k])=>k!=='<synthetic>');
    charts.modelDist = new Chart(el('c-model-dist'),{type:'doughnut',data:{labels:models.map(([k])=>k.replace('claude-','')),datasets:[{data:models.map(([,v])=>v.messages),backgroundColor:PALETTE,borderColor:getComputedStyle(document.body).getPropertyValue('--bg-card').trim(),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}}}}});

    // Cache
    charts.cache = new Chart(el('c-cache'),{type:'bar',data:{labels:dates,datasets:[{label:'Cache Read',data:dl.map(d=>d.cacheRead),backgroundColor:COLORS.green+'80',stack:'s'},{label:'Cache Write',data:dl.map(d=>d.cacheWrite),backgroundColor:COLORS.orange+'80',stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:'rgba(42,45,62,0.3)'}},x:{stacked:true,grid:{display:false}}}}});

    // Messages/day
    charts.msgsDay = new Chart(el('c-msgs-day'),{type:'line',data:{labels:dates,datasets:[{label:'Messages',data:dl.map(d=>d.messages),borderColor:COLORS.purple,backgroundColor:COLORS.purple+'20',fill:true,tension:0.3,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(42,45,62,0.3)'}},x:{grid:{display:false}}}}});

    // Model cost bar
    const mSorted=models.sort(([,a],[,b])=>b.cost-a.cost);
    charts.modelCost = new Chart(el('c-model-cost'),{type:'bar',data:{labels:mSorted.map(([k])=>k.replace('claude-','')),datasets:[{data:mSorted.map(([,v])=>v.cost),backgroundColor:PALETTE,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtCost(c.parsed.x)}}},scales:{x:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:'rgba(42,45,62,0.3)'}},y:{grid:{display:false}}}}});

    // Project daily tokens stacked
    const pdt = data.projectDailyTokens || [];
    const allDates=[...new Set(pdt.map(r=>r.date))].sort();
    const topProj=[...new Set(p.slice(0,10).map(x=>x.name))];
    const pdDatasets=topProj.map((name,i)=>{const map={};pdt.filter(r=>r.project_name===name).forEach(r=>map[r.date]=r.tokens);return{label:name,data:allDates.map(d=>map[d]||0),backgroundColor:PALETTE[i]+'90',borderColor:PALETTE[i],borderWidth:1,fill:true,stack:'s'};});
    const restMap={};pdt.filter(r=>!topProj.includes(r.project_name)).forEach(r=>restMap[r.date]=(restMap[r.date]||0)+r.tokens);
    if(Object.keys(restMap).length)pdDatasets.push({label:'Others',data:allDates.map(d=>restMap[d]||0),backgroundColor:'#5c607840',borderColor:'#5c6078',fill:true,stack:'s'});
    charts.projDaily = new Chart(el('c-proj-daily'),{type:'bar',data:{labels:allDates.map(fmtDate),datasets:pdDatasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10}}}},scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:'rgba(42,45,62,0.3)'}},x:{stacked:true,grid:{display:false}}}}});

    // Project bar
    charts.projBar = new Chart(el('c-proj-bar'),{type:'bar',data:{labels:p.map(x=>x.name),datasets:[{data:p.map(x=>x.totalCost),backgroundColor:PALETTE.map(c=>c+'99'),borderColor:PALETTE,borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>[`Value: ${fmtCost(p[c.dataIndex].totalCost)}`,`Msgs: ${fmt(p[c.dataIndex].totalMessages)}`]}}},scales:{x:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:'rgba(42,45,62,0.3)'}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});

    // Cumulative
    let cum=0; const cumData=dl.map(d=>{cum+=d.cost;return cum;});
    charts.cumulative = new Chart(el('c-cumulative'),{type:'line',data:{labels:dates,datasets:[{label:'Cumulative',data:cumData,borderColor:COLORS.red,backgroundColor:COLORS.red+'15',fill:true,tension:0.3,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:'rgba(42,45,62,0.3)'}},x:{grid:{display:false}}}}});

    // Project table
    const maxCost=p[0]?.totalCost||1;
    document.getElementById('proj-tbody').innerHTML=p.map(x=>`<tr>
        <td><div class="project-name">${x.name}</div><div class="project-path" title="${x.path}">${x.path}</div></td>
        <td class="text-right mono">${fmtCost(x.totalCost)}</td><td class="text-right mono">${fmt(x.totalMessages)}</td>
        <td class="text-right mono">${x.sessionCount}</td><td class="text-right mono">${fmtTokens(x.totalInputTokens)}</td>
        <td class="text-right mono">${fmtTokens(x.totalOutputTokens)}</td><td class="text-right mono">${fmtTokens(x.totalCacheRead)}</td>
        <td class="text-right mono">${fmtTokens(x.totalCacheWrite)}</td>
        <td class="text-right"><div class="cost-bar"><div class="cost-bar-fill" style="width:${(x.totalCost/maxCost*100).toFixed(1)}%"></div></div><div style="font-size:10px;color:var(--text-muted)">${(x.totalCost/apiVal*100).toFixed(1)}%</div></td>
        <td class="text-right mono" style="font-size:10px">${x.lastActivity?fmtDate(x.lastActivity):'-'}</td>
    </tr>`).join('');

    // Model table
    document.getElementById('model-tbody').innerHTML=models.map(([name,m])=>`<tr>
        <td class="mono" style="color:var(--accent-blue)">${name}</td><td class="text-right mono">${fmt(m.messages)}</td>
        <td class="text-right mono">${fmtTokens(m.inputTokens)}</td><td class="text-right mono">${fmtTokens(m.outputTokens)}</td>
        <td class="text-right mono">${fmtTokens(m.cacheRead)}</td><td class="text-right mono">${fmtTokens(m.cacheWrite)}</td>
        <td class="text-right mono">${fmtCost(m.cost)}</td><td class="text-right mono">${(m.cost/apiVal*100).toFixed(1)}%</td>
    </tr>`).join('');
}

// ── SESSIONS TAB ─────────────────────────────────
async function renderSessions() {
    const app=document.getElementById('sessions-app');
    app.innerHTML='<div class="loading"><div class="spinner"></div>Loading sessions...</div>';
    const params=new URLSearchParams({limit:'100',...dateFilter});
    const sessions=await(await fetch('/api/sessions?'+params)).json();

    // Build Gantt timeline data
    const ganttSessions = sessions.filter(s => s.first_timestamp && s.last_timestamp).slice(0, 40);
    const projectNames = [...new Set(ganttSessions.map(s => s.project_name))];
    const projectColorMap = {};
    projectNames.forEach((n, i) => projectColorMap[n] = PALETTE[i % PALETTE.length]);

    app.innerHTML=`
        ${ganttSessions.length > 0 ? `<div class="chart-card" style="margin-bottom:12px"><h3>Session Timeline</h3>
            <div class="chart-container" style="height:${Math.max(200, ganttSessions.length * 22 + 40)}px"><canvas id="c-gantt"></canvas></div></div>` : ''}
        <div class="table-card"><h3>Sessions (${sessions.length})</h3>
        <table><thead><tr><th>Project</th><th>Branch</th><th class="text-right">Messages</th><th class="text-right">API Value</th>
        <th class="text-right">Input</th><th class="text-right">Output</th><th class="text-right">Started</th><th class="text-right">Last Active</th></tr></thead>
        <tbody>${sessions.map(s=>`<tr class="clickable" onclick="showSession('${s.id}')">
            <td class="project-name">${s.project_name}</td><td class="mono" style="font-size:10px">${s.git_branch||'-'}</td>
            <td class="text-right mono">${s.message_count}</td><td class="text-right mono">${fmtCost(s.total_cost||0)}</td>
            <td class="text-right mono">${fmtTokens(s.total_input_tokens||0)}</td><td class="text-right mono">${fmtTokens(s.total_output_tokens||0)}</td>
            <td class="text-right mono" style="font-size:10px">${fmtDateTime(s.first_timestamp)}</td>
            <td class="text-right mono" style="font-size:10px">${fmtDateTime(s.last_timestamp)}</td>
        </tr>`).join('')}</tbody></table></div>`;

    // Render Gantt chart
    if (ganttSessions.length > 0) {
        const labels = ganttSessions.map((s, i) => s.project_name + ' #' + (i + 1));
        const data = ganttSessions.map(s => {
            const start = new Date(s.first_timestamp).getTime();
            const end = new Date(s.last_timestamp).getTime();
            return [start, Math.max(end, start + 60000)]; // min 1min bar
        });

        new Chart(el('c-gantt'), {
            type: 'bar',
            data: {
                labels,
                datasets: [{
                    data: data,
                    backgroundColor: ganttSessions.map(s => (projectColorMap[s.project_name] || COLORS.blue) + '90'),
                    borderColor: ganttSessions.map(s => projectColorMap[s.project_name] || COLORS.blue),
                    borderWidth: 1,
                    borderRadius: 3,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => {
                                const s = ganttSessions[ctx.dataIndex];
                                const dur = ((new Date(s.last_timestamp) - new Date(s.first_timestamp)) / 60000).toFixed(0);
                                return [
                                    `${fmtDateTime(s.first_timestamp)} → ${fmtDateTime(s.last_timestamp)}`,
                                    `Duration: ${dur} min | Msgs: ${s.message_count} | ${fmtCost(s.total_cost || 0)}`
                                ];
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'linear',
                        position: 'top',
                        ticks: {
                            callback: v => {
                                const d = new Date(v);
                                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                            },
                            maxTicksLimit: 8,
                        },
                        grid: { color: 'rgba(42,45,62,0.3)' }
                    },
                    y: {
                        grid: { display: false },
                        ticks: { font: { size: 10 } }
                    }
                }
            }
        });
    }
}

        <button class="btn back-btn" onclick="renderSessions()">&larr; Back</button>
        <div class="kpi-grid" style="margin-bottom:16px">
            <div class="kpi-card"><div class="kpi-label">Project</div><div class="kpi-value blue" style="font-size:16px">${s.project_name}</div><div class="kpi-sub">${s.project_path}</div></div>

            <td class="text-right mono">${fmtCost(a.total_cost||0)}</td><td class="text-right mono">${fmtTokens((a.total_input_tokens||0)+(a.total_output_tokens||0))}</td></tr>`).join('')}</tbody></table></div>`:''}
        ${detail.toolCalls.length?`<div class="table-card"><h3>Tool Usage</h3>

        <div class="table-card"><h3>Message Timeline (${detail.messages.length})</h3>
            <div class="msg-timeline">${detail.messages.slice(0,500).map(m=>`
                <div class="msg-item ${m.type}">
                    <div class="msg-meta">${m.type}${m.model?' &middot; '+m.model:''}${m.cost?' &middot; '+fmtCost(m.cost):''}${m.has_tool_use?' &middot; 🔧':''} &middot; ${fmtDateTime(m.timestamp)}${m.agent_slug?' &middot; 🤖 '+m.agent_slug:''}</div>
                    ${m.content_preview?`<div class="msg-preview">${escHtml(m.content_preview)}</div>`:''}
                </div>`).join('')}
                ${detail.messages.length>500?`<div style="padding:12px;color:var(--text-muted);font-size:12px">...and ${detail.messages.length-500} more messages</div>`:''}
            </div></div>`;
}

// ── GIT COSTS TAB ────────────────────────────────
async function renderGit() {
    const app=document.getElementById('git-app');
    app.innerHTML='<div class="loading"><div class="spinner"></div>Scanning git repos...</div>';

    const params=new URLSearchParams(dateFilter);
    const [summary, projects, branches, expensive, timeline] = await Promise.all([
        fetch('/api/git/summary').then(r=>r.json()),
        fetch('/api/git/projects?'+params).then(r=>r.json()),
        fetch('/api/git/branches?'+params).then(r=>r.json()),
        fetch('/api/git/expensive?limit=15').then(r=>r.json()),
        fetch('/api/git/timeline?'+params).then(r=>r.json()),
    ]);

    if(summary.totalCommits===0){app.innerHTML='<div class="chart-card" style="padding:40px;text-align:center;color:var(--text-muted)">No git repositories found in your projects.</div>';return;}

    const linkPct = summary.totalCommits>0 ? ((summary.linkedCommits/summary.totalCommits)*100).toFixed(0) : 0;

    app.innerHTML=`
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-label">Total Commits</div><div class="kpi-value blue">${fmt(summary.totalCommits)}</div><div class="kpi-sub">${linkPct}% linked to sessions</div></div>
            <div class="kpi-card"><div class="kpi-label">Total AI-Assisted Cost</div><div class="kpi-value green">${fmtCost(summary.totalCost)}</div><div class="kpi-sub">${summary.linkedCommits} commits with cost data</div></div>
            <div class="kpi-card"><div class="kpi-label">Avg Cost / Commit</div><div class="kpi-value purple">${fmtCost(summary.avgCostPerCommit)}</div><div class="kpi-sub">API equivalent per commit</div></div>
            <div class="kpi-card"><div class="kpi-label">Lines Written</div><div class="kpi-value cyan">+${fmt(summary.totalInsertions)}</div><div class="kpi-sub">-${fmt(summary.totalDeletions)} deleted</div></div>
            <div class="kpi-card"><div class="kpi-label">Cost / Line of Code</div><div class="kpi-value orange">${fmtCost(summary.costPerLine)}</div><div class="kpi-sub">per line added or deleted</div></div>
        </div>

        <div class="grid-eq">
            <div class="chart-card"><h3>Cost by Project (Git)</h3><div class="chart-container tall"><canvas id="c-git-proj"></canvas></div></div>
            <div class="chart-card"><h3>Commits Timeline</h3><div class="chart-container tall"><canvas id="c-git-timeline"></canvas></div></div>
        </div>

        <div class="grid-eq">
            <div class="table-card"><h3>Cost by Project</h3>
                <table><thead><tr><th>Project</th><th class="text-right">Commits</th><th class="text-right">Linked</th>
                <th class="text-right">API Value</th><th class="text-right">+Lines</th><th class="text-right">-Lines</th>
                <th class="text-right">$/Commit</th><th class="text-right">$/Line</th></tr></thead>
                <tbody>${projects.map(p=>{
                    const cpc=(p.total_cost||0)/Math.max(p.linked_commits||1,1);
                    const cpl=(p.total_cost||0)/Math.max((p.insertions||0)+(p.deletions||0),1);
                    return `<tr><td class="project-name">${p.project_name}</td>
                    <td class="text-right mono">${p.commits}</td><td class="text-right mono">${p.linked_commits||0}</td>
                    <td class="text-right mono">${fmtCost(p.total_cost||0)}</td>
                    <td class="text-right mono lines-added">+${fmt(p.insertions||0)}</td>
                    <td class="text-right mono lines-deleted">-${fmt(p.deletions||0)}</td>
                    <td class="text-right mono">${fmtCost(cpc)}</td>
                    <td class="text-right mono">${fmtCost(cpl)}</td></tr>`;
                }).join('')}</tbody></table></div>

            <div class="table-card"><h3>Cost by Branch</h3>
                <table><thead><tr><th>Branch</th><th>Project</th><th class="text-right">Commits</th>
                <th class="text-right">API Value</th><th class="text-right">+Lines</th><th class="text-right">-Lines</th></tr></thead>
                <tbody>${branches.slice(0,20).map(b=>`<tr>
                    <td><span class="branch-badge">${b.branch}</span></td>
                    <td class="project-name">${b.project_name}</td>
                    <td class="text-right mono">${b.commits}</td>
                    <td class="text-right mono">${fmtCost(b.total_cost||0)}</td>
                    <td class="text-right mono lines-added">+${fmt(b.insertions||0)}</td>
                    <td class="text-right mono lines-deleted">-${fmt(b.deletions||0)}</td>
                </tr>`).join('')}</tbody></table></div>
        </div>

        <div class="table-card"><h3>Most Expensive Commits</h3>
            <table><thead><tr><th>Commit</th><th>Project</th><th>Message</th><th>Branch</th>
            <th class="text-right">API Value</th><th class="text-right">+/-</th><th class="text-right">Date</th></tr></thead>
            <tbody>${expensive.map(c=>`<tr>
                <td class="commit-hash">${c.hash.slice(0,8)}</td>
                <td class="project-name">${c.project_name}</td>
                <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(c.message)}">${escHtml(c.message.slice(0,60))}</td>
                <td><span class="branch-badge">${c.branch}</span></td>
                <td class="text-right mono">${fmtCost(c.estimated_cost)}</td>
                <td class="text-right mono"><span class="lines-added">+${c.insertions}</span> <span class="lines-deleted">-${c.deletions}</span></td>
                <td class="text-right mono" style="font-size:10px">${fmtDate(c.date)}</td>
            </tr>`).join('')}</tbody></table></div>`;

    // Chart: cost by project
    new Chart(el('c-git-proj'),{type:'bar',data:{
        labels:projects.map(p=>p.project_name),
        datasets:[{label:'API Value',data:projects.map(p=>p.total_cost||0),backgroundColor:PALETTE.map(c=>c+'99'),borderColor:PALETTE,borderWidth:1,borderRadius:4}]
    },options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtCost(c.parsed.x)+' ('+projects[c.dataIndex].commits+' commits)'}}},scales:{x:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:'rgba(42,45,62,0.3)'}},y:{grid:{display:false}}}}});

    // Chart: timeline
    const tlDates=[...new Set(timeline.map(t=>t.date.slice(0,10)))].sort();
    const tlProjects=[...new Set(timeline.map(t=>t.project_name))];
    const tlDatasets=tlProjects.slice(0,8).map((name,i)=>{
        const map={};timeline.filter(t=>t.project_name===name).forEach(t=>map[t.date.slice(0,10)]=(map[t.date.slice(0,10)]||0)+t.cost);
        return{label:name,data:tlDates.map(d=>map[d]||0),backgroundColor:PALETTE[i]+'90',borderColor:PALETTE[i],borderWidth:1,stack:'s'};
    });
    new Chart(el('c-git-timeline'),{type:'bar',data:{labels:tlDates.map(fmtDate),datasets:tlDatasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10}}}},scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:'rgba(42,45,62,0.3)'}},x:{stacked:true,grid:{display:false}}}}});
}

// ── INSIGHTS TAB ─────────────────────────────────
async function renderInsights() {
    const app=document.getElementById('insights-app');
    app.innerHTML='<div class="loading"><div class="spinner"></div>Analyzing...</div>';
    const insights=await(await fetch('/api/insights')).json();
    if(insights.length===0){app.innerHTML='<div class="chart-card" style="padding:40px;text-align:center;color:var(--text-muted)">No insights to show. Keep using Claude Code!</div>';return;}
    app.innerHTML=`<div class="chart-card"><h3>AI Insights (${insights.length})</h3>${insights.map(i=>`
        <div class="insight ${i.severity}"><div class="insight-title">${escHtml(i.title)}</div><div class="insight-detail">${escHtml(i.detail)}</div></div>
    `).join('')}</div>`;
}

// ── Browser Notifications ────────────────────────
let notificationsEnabled = false;
function requestNotifications() {
    if (!('Notification' in window)) return;
    Notification.requestPermission().then(p => {
        notificationsEnabled = p === 'granted';
        showToast(notificationsEnabled ? 'Notifications enabled' : 'Notifications denied');
    });
}
if ('Notification' in window && Notification.permission === 'granted') notificationsEnabled = true;

function sendNotification(title, body) {
    if (!notificationsEnabled) return;
    try { new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">📡</text></svg>' }); } catch {}
}

// ── WebSocket for real-time ──────────────────────
function connectWS() {
    try {
        const ws = new WebSocket('ws://' + location.host + '/ws');
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'refresh') {
                loadAndRender();
                showToast('Live update: ' + (msg.indexed || 0) + ' new files');
                sendNotification('Claude Radar', (msg.indexed || 0) + ' new files indexed');
            }
        };
        ws.onclose = () => setTimeout(connectWS, 5000);
    } catch {}
}
connectWS();

// ── Report Generator ─────────────────────────────
async function generateReport() {
    if (!currentData) return;
    const s = currentData.summary;
    const sub = currentData.subscription || {};
    const apiVal = s.apiEquivalentCost || 0;
    const roi = sub.actualCost > 0 ? (apiVal / sub.actualCost).toFixed(1) : 'N/A';
    const projects = currentData.projects || [];

    let gitSection = '';
    try {
        const gitSummary = await (await fetch('/api/git/summary')).json();
        const gitExpensive = await (await fetch('/api/git/expensive?limit=10')).json();
        if (gitSummary.totalCommits > 0) {
            gitSection = `
            <div class="section">
                <h2>Git-to-Cost Analysis</h2>
                <div class="kpi-row">
                    <div class="kpi"><div class="val">${gitSummary.totalCommits}</div><div class="lbl">Total Commits</div></div>
                    <div class="kpi"><div class="val">${gitSummary.linkedCommits}</div><div class="lbl">Linked to Sessions</div></div>
                    <div class="kpi"><div class="val">$${gitSummary.avgCostPerCommit.toFixed(2)}</div><div class="lbl">Avg $/Commit</div></div>
                    <div class="kpi"><div class="val">$${gitSummary.costPerLine.toFixed(4)}</div><div class="lbl">$/Line of Code</div></div>
                </div>
                <h3>Most Expensive Commits</h3>
                <table>
                    <tr><th>Cost</th><th>Project</th><th>Commit</th><th>Message</th></tr>
                    ${gitExpensive.map(c => `<tr><td>$${c.estimated_cost.toFixed(2)}</td><td>${c.project_name}</td><td style="font-family:monospace">${c.hash.slice(0,8)}</td><td>${c.message.slice(0,60)}</td></tr>`).join('')}
                </table>
            </div>`;
        }
    } catch {}

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Claude Radar Report</title><style>
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:900px;margin:0 auto;padding:40px;color:#1a1d27;background:#fff}
        h1{font-size:28px;margin-bottom:4px} .subtitle{color:#666;margin-bottom:32px;font-size:14px}
        .section{margin-bottom:32px} h2{font-size:18px;border-bottom:2px solid #e0e2ea;padding-bottom:8px;margin-bottom:16px}
        h3{font-size:14px;color:#666;margin:16px 0 8px}
        .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:20px}
        .kpi{background:#f5f6fa;border-radius:10px;padding:16px;text-align:center}
        .kpi .val{font-size:24px;font-weight:700;color:#4f8ff7} .kpi .lbl{font-size:11px;color:#888;margin-top:4px;text-transform:uppercase}
        table{width:100%;border-collapse:collapse;font-size:13px} th{text-align:left;padding:8px;border-bottom:2px solid #e0e2ea;font-size:11px;text-transform:uppercase;color:#888}
        td{padding:8px;border-bottom:1px solid #f0f0f0} tr:hover td{background:#f9f9ff}
        .footer{margin-top:40px;font-size:11px;color:#aaa;text-align:center;border-top:1px solid #e0e2ea;padding-top:16px}
    </style></head><body>
        <h1>Claude Radar Report</h1>
        <div class="subtitle">Generated ${new Date().toLocaleString()} | ${sub.plan || 'Unknown'} Plan</div>

        <div class="section">
            <h2>Summary</h2>
            <div class="kpi-row">
                <div class="kpi"><div class="val">$${sub.actualCost || 0}</div><div class="lbl">Actual Cost</div></div>
                <div class="kpi"><div class="val">$${apiVal.toFixed(2)}</div><div class="lbl">API Equivalent</div></div>
                <div class="kpi"><div class="val">${roi}x</div><div class="lbl">ROI</div></div>
                <div class="kpi"><div class="val">${s.totalMessages.toLocaleString()}</div><div class="lbl">Messages</div></div>
                <div class="kpi"><div class="val">${s.totalProjects}</div><div class="lbl">Projects</div></div>
                <div class="kpi"><div class="val">${s.totalSessions}</div><div class="lbl">Sessions</div></div>
            </div>
        </div>

        <div class="section">
            <h2>Projects by API Value</h2>
            <table>
                <tr><th>Project</th><th style="text-align:right">API Value</th><th style="text-align:right">Messages</th><th style="text-align:right">Sessions</th><th style="text-align:right">Share</th></tr>
                ${projects.map(p => `<tr><td><strong>${p.name}</strong></td><td style="text-align:right">$${p.totalCost.toFixed(2)}</td><td style="text-align:right">${p.totalMessages}</td><td style="text-align:right">${p.sessionCount}</td><td style="text-align:right">${(p.totalCost/apiVal*100).toFixed(1)}%</td></tr>`).join('')}
            </table>
        </div>

        <div class="section">
            <h2>Model Usage</h2>
            <table>
                <tr><th>Model</th><th style="text-align:right">Messages</th><th style="text-align:right">API Value</th><th style="text-align:right">Share</th></tr>
                ${Object.entries(currentData.modelUsage).filter(([k])=>k!=='<synthetic>').sort(([,a],[,b])=>b.cost-a.cost).map(([name,m])=>`<tr><td>${name}</td><td style="text-align:right">${m.messages}</td><td style="text-align:right">$${m.cost.toFixed(2)}</td><td style="text-align:right">${(m.cost/apiVal*100).toFixed(1)}%</td></tr>`).join('')}
            </table>
        </div>

        ${gitSection}

        <div class="footer">Generated by Claude Radar | github.com/berenceylan/claude-radar</div>
    </body></html>`;

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'claude-radar-report.html'; a.click();
    URL.revokeObjectURL(url);
    showToast('Report downloaded');
}

// ── Helpers ──────────────────────────────────────
function el(id){return document.getElementById(id).getContext('2d');}
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ── Init ─────────────────────────────────────────
loadAndRender().catch(err => {
    document.getElementById('overview-app').innerHTML=`<div class="loading" style="flex-direction:column;gap:12px">
        <div style="color:var(--accent-red)">Failed to load</div><div style="color:var(--text-muted);font-size:12px">${err.message}</div></div>`;
});
</script>
