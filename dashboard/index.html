<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Radar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Themes ──────────────────────────────────── */
        [data-theme="dark"] {
            --bg-0: #08090d; --bg-1: #0f1117; --bg-2: #171923; --bg-3: #1e2130;
            --border: #262a3a; --border-hover: #3b4060;
            --text-1: #eaecf4; --text-2: #8b8fa3; --text-3: #50546a;
            --glow: rgba(79,143,247,0.08);
        }
        [data-theme="light"] {
            --bg-0: #f0f2f7; --bg-1: #f8f9fc; --bg-2: #ffffff; --bg-3: #ffffff;
            --border: #dfe2ea; --border-hover: #c0c4d0;
            --text-1: #111827; --text-2: #4b5563; --text-3: #9ca3af;
            --glow: rgba(79,143,247,0.05);
        }
        [data-theme="contrast"] {
            --bg-0: #000; --bg-1: #0a0a0a; --bg-2: #141414; --bg-3: #1e1e1e;
            --border: #333; --border-hover: #555;
            --text-1: #fff; --text-2: #bbb; --text-3: #777;
            --glow: rgba(79,143,247,0.12);
        }
        :root {
            --blue: #4f8ff7; --purple: #a855f7; --green: #22c55e; --orange: #f59e0b;
            --red: #ef4444; --cyan: #06b6d4; --pink: #ec4899; --indigo: #6366f1;
            --radius: 10px; --transition: 180ms ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Fira Code', 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
            background: var(--bg-0); color: var(--text-1);
            min-height: 100vh; display: flex;
            -webkit-font-smoothing: antialiased;
            font-size: 13px;
        }

        /* ── Sidebar ─────────────────────────────────── */
        .sidebar {
            width: 220px; min-height: 100vh; background: var(--bg-1);
            border-right: 1px solid var(--border); padding: 20px 0;
            display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100;
        }
        .sidebar-brand { padding: 0 20px 24px; display: flex; align-items: center; gap: 10px; }
        .sidebar-brand svg { width: 28px; height: 28px; }
        .sidebar-brand span { font-size: 16px; font-weight: 700; background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar-nav { flex: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 20px; margin: 2px 8px; border-radius: 8px;
            font-size: 13px; font-weight: 500; color: var(--text-2);
            cursor: pointer; transition: all var(--transition); user-select: none;
        }
        .nav-item:hover { background: var(--glow); color: var(--text-1); }
        .nav-item.active { background: var(--glow); color: var(--blue); font-weight: 600; }
        .nav-item svg { width: 18px; height: 18px; opacity: 0.6; flex-shrink: 0; pointer-events: none; }
        .nav-item * { pointer-events: none; }
        .nav-item.active svg { opacity: 1; }
        .nav-section { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); padding: 16px 20px 6px; }
        .sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--border); }
        .sidebar-footer .meta { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

        /* ── Main Content ────────────────────────────── */
        .main { margin-left: 220px; flex: 1; min-height: 100vh; }
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: var(--bg-1); border-bottom: 1px solid var(--border);
            padding: 12px 28px; display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(12px);
        }
        .topbar-title { font-size: 15px; font-weight: 600; flex: 1; }
        .page { padding: 24px 28px; }

        /* ── Controls ────────────────────────────────── */
        .btn {
            background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2);
            padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 12px;
            font-family: inherit; transition: all var(--transition);
            display: inline-flex; align-items: center; gap: 5px;
        }
        .btn:hover { background: var(--bg-3); color: var(--text-1); border-color: var(--border-hover); }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
        .btn-primary:hover { opacity: .85; }
        .input {
            background: var(--bg-2); border: 1px solid var(--border); color: var(--text-1);
            padding: 6px 10px; border-radius: 7px; font-size: 12px; font-family: inherit; outline: none;
        }
        .input:focus { border-color: var(--blue); }
        .sep { width: 1px; height: 20px; background: var(--border); }

        /* ── Hero KPIs ───────────────────────────────── */
        .hero-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .hero-card {
            background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px 24px; position: relative; overflow: hidden;
            transition: border-color var(--transition);
        }
        .hero-card:hover { border-color: var(--border-hover); }
        .hero-card .label { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
        .hero-card .value { font-size: 32px; font-weight: 700; font-family: 'Fira Code', monospace; line-height: 1; }
        .hero-card .sub { font-size: 12px; color: var(--text-2); margin-top: 6px; }
        .hero-card .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 2px; }

        /* ── Stat Row ────────────────────────────────── */
        .stat-row { display: flex; gap: 24px; margin-bottom: 24px; padding: 14px 20px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); }
        .stat-item { display: flex; flex-direction: column; }
        .stat-item .s-val { font-size: 15px; font-weight: 600; font-family: 'Fira Code', monospace; }
        .stat-item .s-lbl { font-size: 11px; color: var(--text-3); margin-top: 2px; }

        /* ── Cards & Bento Grid ──────────────────────── */
        .bento { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-bottom: 16px; }
        .card {
            background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 18px; transition: border-color var(--transition);
        }
        .card:hover { border-color: var(--border-hover); }
        .card-header { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: .3px; }
        .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; }
        .span-6 { grid-column: span 6; } .span-12 { grid-column: span 12; }
        .chart-wrap { position: relative; width: 100%; }
        .chart-h-sm { height: 180px; } .chart-h-md { height: 240px; } .chart-h-lg { height: 300px; }

        /* ── Tables ──────────────────────────────────── */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
        tr { cursor: pointer; transition: background var(--transition); }
        tr:hover td { background: var(--glow); }
        .mono { font-family: 'Fira Code', monospace; font-size: 11px; }
        .text-right { text-align: right; }
        .project-name { font-weight: 600; color: var(--blue); }
        .project-path { font-size: 10px; color: var(--text-3); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-track { height: 4px; background: var(--border); border-radius: 2px; min-width: 60px; }
        .bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--purple)); }

        /* ── Git ─────────────────────────────────────── */
        .commit-hash { font-family: 'Fira Code', monospace; font-size: 11px; color: var(--orange); }
        .branch-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; background: rgba(168,85,247,.1); color: var(--purple); }
        .lines-add { color: var(--green); } .lines-del { color: var(--red); }

        /* ── Insights ────────────────────────────────── */
        .insight { padding: 14px 18px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid; }
        .insight.warning { background: rgba(245,158,11,.06); border-color: var(--orange); }
        .insight.info { background: rgba(79,143,247,.04); border-color: var(--blue); }
        .insight-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
        .insight-detail { font-size: 12px; color: var(--text-2); line-height: 1.5; }

        /* ── Sessions ────────────────────────────────── */
        .msg-timeline { max-height: 500px; overflow-y: auto; }
        .msg-item { padding: 8px 14px; border-left: 2px solid var(--border); margin-left: 8px; margin-bottom: 3px; font-size: 12px; transition: background var(--transition); }
        .msg-item:hover { background: var(--glow); }
        .msg-item.user { border-color: var(--blue); }
        .msg-item.assistant { border-color: var(--purple); }
        .msg-meta { font-size: 10px; color: var(--text-3); margin-bottom: 2px; font-family: 'Fira Code', monospace; }
        .msg-preview { color: var(--text-2); word-break: break-word; line-height: 1.5; }

        /* ── Modal ───────────────────────────────────── */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); z-index:1000; justify-content:center; align-items:center; }
        .modal-overlay.open { display:flex; }
        .modal { background:var(--bg-2); border:1px solid var(--border); border-radius:14px; padding:28px; width:400px; max-width:90vw; }
        .modal h2 { font-size:16px; font-weight:700; margin-bottom:20px; }
        .modal label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-3); margin-bottom:5px; }
        .modal select, .modal input { width:100%; background:var(--bg-1); border:1px solid var(--border); border-radius:7px; padding:9px 12px; color:var(--text-1); font-size:13px; font-family:inherit; margin-bottom:14px; outline:none; }
        .modal select:focus, .modal input:focus { border-color:var(--blue); }
        .modal-actions { display:flex; gap:8px; justify-content:flex-end; }

        /* ── Toast ───────────────────────────────────── */
        .toast { position:fixed; bottom:24px; right:24px; background:var(--bg-3); border:1px solid var(--green); color:var(--text-1); padding:10px 18px; border-radius:8px; font-size:12px; z-index:1001; opacity:0; transform:translateY(10px); transition:all .3s; font-family:'Fira Code',monospace; }
        .toast.show { opacity:1; transform:translateY(0); }

        /* ── Tab Content ─────────────────────────────── */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Loading ─────────────────────────────────── */
        .loading { display:flex; justify-content:center; align-items:center; height:300px; color:var(--text-3); }
        .spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; margin-right:10px; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* ── Responsive ──────────────────────────────── */
        @media (max-width:1200px) { .bento { grid-template-columns: repeat(6,1fr); } .span-8,.span-4 { grid-column: span 6; } }
        @media (max-width:768px) {
            .sidebar { display:none; }
            .main { margin-left:0; }
            .hero-kpis { grid-template-columns: 1fr; }
            .bento { grid-template-columns: 1fr; }
            .span-8,.span-4,.span-6,.span-12 { grid-column: span 1; }
            .stat-row { flex-wrap: wrap; }
            .page { padding: 16px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; } }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round"><defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24"><stop offset="0%" stop-color="var(--blue)"/><stop offset="100%" stop-color="var(--purple)"/></linearGradient></defs><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10"/><path d="M2 12h20"/></svg>
            <span>Claude Radar</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Monitor</div>
            <div class="nav-item active" data-tab="overview">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Overview
            </div>
            <div class="nav-item" data-tab="sessions">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Sessions
            </div>
            <div class="nav-section">Analyze</div>
            <div class="nav-item" data-tab="git">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/></svg>
                Git Costs
            </div>
            <div class="nav-item" data-tab="project">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                Project Deep Dive
            </div>
            <div class="nav-item" data-tab="tools">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                Tools
            </div>
            <div class="nav-item" data-tab="insights">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Insights
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="meta"><span class="live-dot"></span><span id="sidebar-meta">Connecting...</span></div>
        </div>
    </aside>

    <!-- Main -->
    <div class="main">
        <div class="topbar">
            <div class="topbar-title" id="page-title">Overview</div>
            <input type="date" class="input" id="start-date" title="Start date">
            <input type="date" class="input" id="end-date" title="End date">
            <button class="btn" onclick="applyDateFilter()">Filter</button>
            <button class="btn" onclick="clearDateFilter()">Reset</button>
            <div class="sep"></div>
            <button class="btn" id="btn-regen" onclick="regenerate()">Refresh</button>
            <button class="btn" onclick="exportData('json')">JSON</button>
            <button class="btn" onclick="exportData('csv')">CSV</button>
            <button class="btn" onclick="generateReport()">Report</button>
            <button class="btn" onclick="openSettings()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <select class="input" id="theme-select" onchange="setTheme(this.value)" style="width:auto;padding-right:24px">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="contrast">Contrast</option>
            </select>
        </div>

        <div class="tab-content active" id="tab-overview"><div class="page" id="overview-app"><div class="loading"><div class="spinner"></div>Loading...</div></div></div>
        <div class="tab-content" id="tab-sessions"><div class="page" id="sessions-app"></div></div>
        <div class="tab-content" id="tab-tools"><div class="page" id="tools-app"></div></div>
        <div class="tab-content" id="tab-project"><div class="page" id="project-app"></div></div>
        <div class="tab-content" id="tab-git"><div class="page" id="git-app"></div></div>
        <div class="tab-content" id="tab-insights"><div class="page" id="insights-app"></div></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Settings</h2>
            <label>Subscription Plan</label>
            <select id="setting-plan" onchange="toggleCustomRate()">
                <option value="pro_20">Pro - $20/month</option>
                <option value="max_100">Max - $100/month</option>
                <option value="max_200">Max - $200/month</option>
                <option value="team">Team - Custom rate</option>
            </select>
            <div id="custom-rate-row" style="display:none">
                <label>Monthly Rate ($)</label>
                <input type="number" id="setting-rate" placeholder="e.g. 150" />
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

<script>
// ── Globals ──────────────────────────────────────
const COLORS={blue:'#4f8ff7',purple:'#a855f7',green:'#22c55e',orange:'#f59e0b',red:'#ef4444',cyan:'#06b6d4',pink:'#ec4899',indigo:'#6366f1',lime:'#84cc16',amber:'#d97706',teal:'#14b8a6',rose:'#f43f5e'};
const PALETTE=Object.values(COLORS);
const PLAN_RATES={pro_20:20,max_100:100,max_200:200};
let currentData=null,charts={},dateFilter={};

// ── Formatters ───────────────────────────────────
function fmt(n,d=0){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toFixed(d);}
function fmtCost(n){return'$'+(n||0).toFixed(2);}
function fmtTokens(n){if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n||0);}
function fmtDate(s){return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDateTime(s){if(!s)return'-';return new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}

// ── Chart config ─────────────────────────────────
Chart.defaults.color='#8b8fa3';Chart.defaults.borderColor='rgba(42,45,62,0.4)';
Chart.defaults.font.family="'Fira Code','SF Mono',monospace";Chart.defaults.font.size=11;
Chart.defaults.plugins.legend.labels.usePointStyle=true;Chart.defaults.plugins.legend.labels.pointStyleWidth=8;
Chart.defaults.plugins.legend.labels.padding=12;
const gridColor='rgba(42,45,62,0.25)';

// ── Navigation ───────────────────────────────────
const navItems=document.querySelectorAll('.nav-item[data-tab]');
const tabContents=document.querySelectorAll('.tab-content');
const pageTitle=document.getElementById('page-title');
navItems.forEach(item=>{
    item.addEventListener('click',()=>{
        navItems.forEach(n=>n.classList.remove('active'));
        tabContents.forEach(t=>t.classList.remove('active'));
        item.classList.add('active');
        const tab=item.dataset.tab;
        document.getElementById('tab-'+tab).classList.add('active');
        pageTitle.textContent=item.textContent.trim();
        if(tab==='sessions'&&currentData)renderSessions();
        if(tab==='tools'&&currentData)renderTools();
        if(tab==='git')renderGit();
        if(tab==='project')renderProjectPicker();
        if(tab==='insights')renderInsights();
    });
});

// ── Theme ────────────────────────────────────────
function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('radar-theme',t);}
const savedTheme=localStorage.getItem('radar-theme');if(savedTheme){setTheme(savedTheme);document.getElementById('theme-select').value=savedTheme;}

// ── Date Filter ──────────────────────────────────
function applyDateFilter(){dateFilter.startDate=document.getElementById('start-date').value||undefined;dateFilter.endDate=document.getElementById('end-date').value||undefined;loadAndRender();}
function clearDateFilter(){dateFilter={};document.getElementById('start-date').value='';document.getElementById('end-date').value='';loadAndRender();}

// ── Toast / Settings ─────────────────────────────
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
async function openSettings(){const r=await fetch('/api/config');const{config}=await r.json();document.getElementById('setting-plan').value=config.plan||'max_100';document.getElementById('setting-rate').value=config.monthlyRate||'';toggleCustomRate();document.getElementById('settings-modal').classList.add('open');}
function closeSettings(){document.getElementById('settings-modal').classList.remove('open');}
function toggleCustomRate(){document.getElementById('custom-rate-row').style.display=document.getElementById('setting-plan').value==='team'?'block':'none';}
document.getElementById('settings-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSettings();});
async function saveSettings(){const plan=document.getElementById('setting-plan').value;const rate=plan==='team'?parseFloat(document.getElementById('setting-rate').value)||0:PLAN_RATES[plan]||100;await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,monthlyRate:rate})});closeSettings();showToast('Settings saved');loadAndRender();}

function exportData(f){const p=new URLSearchParams(dateFilter);window.open('/api/export/'+f+'?'+p.toString());}
async function regenerate(){const b=document.getElementById('btn-regen');b.disabled=true;try{await fetch('/api/regenerate',{method:'POST'});await loadAndRender();showToast('Data refreshed');}finally{b.disabled=false;}}

// ── Data ─────────────────────────────────────────
async function loadData(){const p=new URLSearchParams(dateFilter);return(await fetch('/api/data?'+p)).json();}
async function loadAndRender(){currentData=await loadData();renderOverview(currentData);}
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={};}

// ── OVERVIEW ─────────────────────────────────────
function renderOverview(data){
    destroyCharts();
    const app=document.getElementById('overview-app');
    const s=data.summary,sub=data.subscription||{plan:'Max',monthlyRate:100,monthsActive:1,actualCost:100};
    const apiVal=s.apiEquivalentCost||0,roi=sub.actualCost>0?(apiVal/sub.actualCost):0;
    const cacheEff=s.totalTokens>0?((s.totalCacheRead/s.totalTokens)*100).toFixed(1):0;

    document.getElementById('sidebar-meta').innerHTML=`Live &middot; ${s.totalProjects} projects`;

    app.innerHTML=`
        <div class="hero-kpis">
            <div class="hero-card"><div class="accent-line" style="background:var(--green)"></div><div class="label">You Paid (${escHtml(sub.plan)})</div><div class="value" style="color:var(--green)">${fmtCost(sub.actualCost)}</div><div class="sub">${fmtCost(sub.monthlyRate)}/mo &times; ${sub.monthsActive} months</div></div>
            <div class="hero-card"><div class="accent-line" style="background:var(--blue)"></div><div class="label">API Equivalent Value</div><div class="value" style="color:var(--blue)">${fmtCost(apiVal)}</div><div class="sub">${fmtCost(s.totalMessages>0?apiVal/s.totalMessages:0)} per message</div></div>
            <div class="hero-card"><div class="accent-line" style="background:var(--purple)"></div><div class="label">Return on Investment</div><div class="value" style="color:var(--purple)">${roi.toFixed(1)}x</div><div class="sub">You got ${fmtCost(apiVal-sub.actualCost)} more value</div></div>
        </div>
        <div class="stat-row">
            <div class="stat-item"><div class="s-val" style="color:var(--cyan)">${fmtTokens(s.totalTokens)}</div><div class="s-lbl">Total Tokens</div></div>
            <div class="stat-item"><div class="s-val">${fmt(s.totalMessages)}</div><div class="s-lbl">Messages</div></div>
            <div class="stat-item"><div class="s-val">${s.totalSessions}</div><div class="s-lbl">Sessions</div></div>
            <div class="stat-item"><div class="s-val">${s.totalProjects}</div><div class="s-lbl">Projects</div></div>
            <div class="stat-item"><div class="s-val" style="color:var(--green)">${cacheEff}%</div><div class="s-lbl">Cache Hit Rate</div></div>
            <div class="stat-item"><div class="s-val">${data.dailyUsage.length}</div><div class="s-lbl">Active Days</div></div>
            <div class="stat-item"><div class="s-val">${fmtTokens(s.totalInputTokens)}</div><div class="s-lbl">Input</div></div>
            <div class="stat-item"><div class="s-val">${fmtTokens(s.totalOutputTokens)}</div><div class="s-lbl">Output</div></div>
        </div>
        <div class="bento">
            <div class="card span-8"><div class="card-header">Daily API Value</div><div class="chart-wrap chart-h-lg"><canvas id="c-daily-cost"></canvas></div></div>
            <div class="card span-4"><div class="card-header">By Project</div><div class="chart-wrap chart-h-lg"><canvas id="c-project-pie"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-6"><div class="card-header">Tokens (Input vs Output)</div><div class="chart-wrap chart-h-md"><canvas id="c-daily-tokens"></canvas></div></div>
            <div class="card span-6"><div class="card-header">Model Distribution</div><div class="chart-wrap chart-h-md"><canvas id="c-model-dist"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-4"><div class="card-header">Cache Read / Write</div><div class="chart-wrap chart-h-sm"><canvas id="c-cache"></canvas></div></div>
            <div class="card span-4"><div class="card-header">Messages Per Day</div><div class="chart-wrap chart-h-sm"><canvas id="c-msgs-day"></canvas></div></div>
            <div class="card span-4"><div class="card-header">Cost Per Model</div><div class="chart-wrap chart-h-sm"><canvas id="c-model-cost"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-12"><div class="card-header">Daily Tokens by Project</div><div class="chart-wrap" style="height:${Math.max(240,data.projects.length*14)}px"><canvas id="c-proj-daily"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-12"><div class="card-header">Cumulative Value</div><div class="chart-wrap chart-h-md"><canvas id="c-cumulative"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-12"><div class="card-header">Project Breakdown</div>
                <div style="overflow-x:auto"><table><thead><tr>
                    <th>Project</th><th class="text-right">API Value</th><th class="text-right">Msgs</th><th class="text-right">Sessions</th>
                    <th class="text-right">Input</th><th class="text-right">Output</th><th class="text-right">Cache R</th><th class="text-right">Cache W</th>
                    <th style="min-width:80px" class="text-right">Share</th><th class="text-right">Last</th>
                </tr></thead><tbody id="proj-tbody"></tbody></table></div>
            </div>
        </div>
        <div class="bento">
            <div class="card span-12"><div class="card-header">Model Breakdown</div>
                <div style="overflow-x:auto"><table><thead><tr>
                    <th>Model</th><th class="text-right">Messages</th><th class="text-right">Input</th><th class="text-right">Output</th>
                    <th class="text-right">Cache R</th><th class="text-right">Cache W</th><th class="text-right">Value</th><th class="text-right">Share</th>
                </tr></thead><tbody id="model-tbody"></tbody></table></div>
            </div>
        </div>`;

    const dl=data.dailyUsage,p=data.projects,mu=data.modelUsage;
    const dates=dl.map(d=>fmtDate(d.date));

    charts.dailyCost=new Chart(el('c-daily-cost'),{type:'bar',data:{labels:dates,datasets:[{data:dl.map(d=>d.cost),backgroundColor:COLORS.blue+'88',borderRadius:3,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtCost(c.parsed.y)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:gridColor}},x:{grid:{display:false}}}}});

    const top8=p.slice(0,8),otherCost=p.slice(8).reduce((s,x)=>s+x.totalCost,0);
    const pieL=[...top8.map(x=>x.name)],pieD=[...top8.map(x=>x.totalCost)];
    if(otherCost>0){pieL.push('Others');pieD.push(otherCost);}
    charts.projPie=new Chart(el('c-project-pie'),{type:'doughnut',data:{labels:pieL,datasets:[{data:pieD,backgroundColor:PALETTE.slice(0,pieL.length),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{font:{size:10},padding:8}}}}});

    charts.dailyTokens=new Chart(el('c-daily-tokens'),{type:'bar',data:{labels:dates,datasets:[{label:'Input',data:dl.map(d=>d.inputTokens),backgroundColor:COLORS.blue+'88',stack:'s'},{label:'Output',data:dl.map(d=>d.outputTokens),backgroundColor:COLORS.purple+'88',stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:gridColor}},x:{stacked:true,grid:{display:false}}}}});

    const models=Object.entries(mu).filter(([k])=>k!=='<synthetic>');
    charts.modelDist=new Chart(el('c-model-dist'),{type:'doughnut',data:{labels:models.map(([k])=>k.replace('claude-','')),datasets:[{data:models.map(([,v])=>v.messages),backgroundColor:PALETTE,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{font:{size:10},padding:8}}}}});

    charts.cache=new Chart(el('c-cache'),{type:'bar',data:{labels:dates,datasets:[{label:'Read',data:dl.map(d=>d.cacheRead),backgroundColor:COLORS.green+'70',stack:'s'},{label:'Write',data:dl.map(d=>d.cacheWrite),backgroundColor:COLORS.orange+'70',stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:gridColor}},x:{stacked:true,grid:{display:false}}}}});

    charts.msgsDay=new Chart(el('c-msgs-day'),{type:'line',data:{labels:dates,datasets:[{data:dl.map(d=>d.messages),borderColor:COLORS.purple,backgroundColor:COLORS.purple+'15',fill:true,tension:.4,pointRadius:1.5,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:gridColor}},x:{grid:{display:false}}}}});

    const mSorted=models.sort(([,a],[,b])=>b.cost-a.cost);
    charts.modelCost=new Chart(el('c-model-cost'),{type:'bar',data:{labels:mSorted.map(([k])=>k.replace('claude-','')),datasets:[{data:mSorted.map(([,v])=>v.cost),backgroundColor:PALETTE,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtCost(c.parsed.x)}}},scales:{x:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:gridColor}},y:{grid:{display:false}}}}});

    const pdt=data.projectDailyTokens||[];
    const allDates=[...new Set(pdt.map(r=>r.date))].sort();
    const topProj=[...new Set(p.slice(0,8).map(x=>x.name))];
    const pdDS=topProj.map((name,i)=>{const map={};pdt.filter(r=>r.project_name===name).forEach(r=>map[r.date]=r.tokens);return{label:name,data:allDates.map(d=>map[d]||0),backgroundColor:PALETTE[i]+'80',stack:'s'};});
    charts.projDaily=new Chart(el('c-proj-daily'),{type:'bar',data:{labels:allDates.map(fmtDate),datasets:pdDS},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10}}}},scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:gridColor}},x:{stacked:true,grid:{display:false}}}}});

    let cum=0;const cumD=dl.map(d=>{cum+=d.cost;return cum;});
    charts.cumulative=new Chart(el('c-cumulative'),{type:'line',data:{labels:dates,datasets:[{data:cumD,borderColor:COLORS.red,backgroundColor:COLORS.red+'10',fill:true,tension:.3,pointRadius:1.5,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:gridColor}},x:{grid:{display:false}}}}});

    const maxCost=p[0]?.totalCost||1;
    document.getElementById('proj-tbody').innerHTML=p.map(x=>`<tr onclick="navTo('project');renderProjectDetail(${x.id})" style="cursor:pointer">
        <td><div class="project-name">${escHtml(x.name)}</div><div class="project-path" title="${escAttr(x.path)}">${escHtml(x.path)}</div></td>
        <td class="text-right mono">${fmtCost(x.totalCost)}</td><td class="text-right mono">${fmt(x.totalMessages)}</td>
        <td class="text-right mono">${x.sessionCount}</td><td class="text-right mono">${fmtTokens(x.totalInputTokens)}</td>
        <td class="text-right mono">${fmtTokens(x.totalOutputTokens)}</td><td class="text-right mono">${fmtTokens(x.totalCacheRead)}</td>
        <td class="text-right mono">${fmtTokens(x.totalCacheWrite)}</td>
        <td class="text-right"><div class="bar-track"><div class="bar-fill" style="width:${(x.totalCost/maxCost*100).toFixed(1)}%"></div></div><div style="font-size:10px;color:var(--text-3);margin-top:2px">${(x.totalCost/apiVal*100).toFixed(1)}%</div></td>
        <td class="text-right mono" style="font-size:10px;color:var(--text-2)">${x.lastActivity?fmtDate(x.lastActivity):'-'}</td>
    </tr>`).join('');

    document.getElementById('model-tbody').innerHTML=models.map(([name,m])=>`<tr>
        <td class="mono" style="color:var(--blue)">${escHtml(name)}</td><td class="text-right mono">${fmt(m.messages)}</td>
        <td class="text-right mono">${fmtTokens(m.inputTokens)}</td><td class="text-right mono">${fmtTokens(m.outputTokens)}</td>
        <td class="text-right mono">${fmtTokens(m.cacheRead)}</td><td class="text-right mono">${fmtTokens(m.cacheWrite)}</td>
        <td class="text-right mono">${fmtCost(m.cost)}</td><td class="text-right mono">${(m.cost/apiVal*100).toFixed(1)}%</td>
    </tr>`).join('');
}

// ── SESSIONS ─────────────────────────────────────
async function renderSessions(){
    const app=document.getElementById('sessions-app');
    app.innerHTML='<div class="loading"><div class="spinner"></div>Loading sessions...</div>';
    const params=new URLSearchParams({limit:'100',...dateFilter});
    const sessions=await(await fetch('/api/sessions?'+params)).json();
    const gantt=sessions.filter(s=>s.first_timestamp&&s.last_timestamp).slice(0,30);
    const pColors={};[...new Set(gantt.map(s=>s.project_name))].forEach((n,i)=>pColors[n]=PALETTE[i%PALETTE.length]);
    const allS=gantt.map(s=>new Date(s.first_timestamp).getTime()),allE=gantt.map(s=>new Date(s.last_timestamp).getTime());
    const rMin=Math.min(...allS)||0,rMax=Math.max(...allE)||1,range=rMax-rMin||1,minBar=range*.015;

    app.innerHTML=`
        ${gantt.length?`<div class="card" style="margin-bottom:16px"><div class="card-header">Session Timeline</div><div class="chart-wrap" style="height:${Math.max(200,gantt.length*32+40)}px"><canvas id="c-gantt"></canvas></div></div>`:''}
        <div class="card"><div class="card-header">Sessions (${sessions.length})</div>
        <div style="overflow-x:auto"><table><thead><tr><th>Project</th><th>Branch</th><th class="text-right">Msgs</th><th class="text-right">Value</th><th class="text-right">Started</th><th class="text-right">Last Active</th></tr></thead>
        <tbody>${sessions.map(s=>`<tr onclick="showSession('${escAttr(s.id)}')">
            <td class="project-name">${escHtml(s.project_name)}</td><td class="mono" style="font-size:10px">${escHtml(s.git_branch||'-')}</td>
            <td class="text-right mono">${s.message_count}</td><td class="text-right mono">${fmtCost(s.total_cost)}</td>
            <td class="text-right mono" style="font-size:10px">${fmtDateTime(s.first_timestamp)}</td>
            <td class="text-right mono" style="font-size:10px">${fmtDateTime(s.last_timestamp)}</td>
        </tr>`).join('')}</tbody></table></div></div>`;

    if(gantt.length){
        const labels=gantt.map(s=>{const d=((new Date(s.last_timestamp)-new Date(s.first_timestamp))/6e4);return s.project_name+' ('+(d>=60?(d/60).toFixed(1)+'h':Math.round(d)+'m')+')';});
        const barData=gantt.map(s=>{const st=new Date(s.first_timestamp).getTime(),en=new Date(s.last_timestamp).getTime();return[st,Math.max(en,st+minBar)];});
        new Chart(el('c-gantt'),{type:'bar',data:{labels,datasets:[{data:barData,backgroundColor:gantt.map(s=>(pColors[s.project_name]||COLORS.blue)+'80'),borderColor:gantt.map(s=>pColors[s.project_name]||COLORS.blue),borderWidth:1,borderRadius:4,borderSkipped:false,barPercentage:.65,categoryPercentage:.8}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const s=gantt[c.dataIndex];const d=((new Date(s.last_timestamp)-new Date(s.first_timestamp))/6e4);return[fmtDateTime(s.first_timestamp)+' -> '+fmtDateTime(s.last_timestamp),'Msgs: '+s.message_count+' | '+fmtCost(s.total_cost)];}}}},scales:{x:{type:'linear',position:'top',min:rMin-range*.02,max:rMax+range*.02,ticks:{callback:v=>{const d=new Date(v);return fmtDate(d)+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});},maxTicksLimit:6},grid:{color:gridColor}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
    }
}

        <div class="hero-kpis" style="margin-bottom:16px">
            <div class="hero-card"><div class="accent-line" style="background:var(--blue)"></div><div class="label">Project</div><div class="value" style="font-size:18px;color:var(--blue)">${escHtml(s.project_name)}</div><div class="sub">${escHtml(s.project_path||'')}</div></div>

        ${det.toolCalls.length?`<div class="card" style="margin-bottom:16px"><div class="card-header">Tools Used</div><table><thead><tr><th>Tool</th><th class="text-right">Calls</th></tr></thead><tbody>${det.toolCalls.map(t=>`<tr><td class="mono">${escHtml(t.tool_name)}</td><td class="text-right mono">${t.count}</td></tr>`).join('')}</tbody></table></div>`:''}
        <div class="card"><div class="card-header">Messages (${det.messages.length})</div>
        <div class="msg-timeline">${det.messages.slice(0,500).map(m=>`<div class="msg-item ${m.type}"><div class="msg-meta">${m.type}${m.model?' / '+m.model:''}${m.cost?' / '+fmtCost(m.cost):''}${m.has_tool_use?' / tools':''}  ${fmtDateTime(m.timestamp)}${m.agent_slug?' / '+escHtml(m.agent_slug):''}</div>${m.content_preview?`<div class="msg-preview">${escHtml(m.content_preview)}</div>`:''}</div>`).join('')}${det.messages.length>500?`<div style="padding:12px;color:var(--text-3);font-size:12px">+ ${det.messages.length-500} more</div>`:''}</div></div>`;
}

// ── TOOLS ────────────────────────────────────────
async function renderTools(){
    const app=document.getElementById('tools-app');
    app.innerHTML='<div class="loading"><div class="spinner"></div></div>';
    const params=new URLSearchParams(dateFilter);
    const[tools,subagents]=await Promise.all([fetch('/api/tools?'+params).then(r=>r.json()),fetch('/api/subagents?'+params).then(r=>r.json())]);
    app.innerHTML=`
        <div class="bento">
            <div class="card span-6"><div class="card-header">Tool Usage</div><div class="chart-wrap chart-h-md"><canvas id="c-tools"></canvas></div></div>
            <div class="card span-6"><div class="card-header">Top Tools</div><div class="chart-wrap chart-h-md"><canvas id="c-tools-bar"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-6"><div class="card-header">All Tools (${tools.length})</div><div style="overflow-x:auto;max-height:400px;overflow-y:auto"><table><thead><tr><th>Tool</th><th class="text-right">Calls</th><th class="text-right">Sessions</th><th class="text-right">Projects</th></tr></thead><tbody>${tools.map(t=>`<tr><td class="mono">${escHtml(t.tool_name)}</td><td class="text-right mono">${fmt(t.count)}</td><td class="text-right mono">${t.sessions}</td><td class="text-right mono">${t.projects}</td></tr>`).join('')}</tbody></table></div></div>

        </div>`;
    const t10=tools.slice(0,10);
    new Chart(el('c-tools'),{type:'doughnut',data:{labels:t10.map(t=>t.tool_name),datasets:[{data:t10.map(t=>t.count),backgroundColor:PALETTE,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'right',labels:{font:{size:10}}}}}});
    new Chart(el('c-tools-bar'),{type:'bar',data:{labels:tools.slice(0,12).map(t=>t.tool_name),datasets:[{data:tools.slice(0,12).map(t=>t.count),backgroundColor:PALETTE,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:gridColor}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
}

// ── PROJECT DEEP DIVE ────────────────────────────
async function renderProjectPicker(){
    const app=document.getElementById('project-app');
    app.innerHTML='<div class="loading"><div class="spinner"></div></div>';

// Helper to navigate to a tab programmatically
function navTo(tab){
    document.querySelectorAll('.nav-item[data-tab]').forEach(n=>{n.classList.remove('active');if(n.dataset.tab===tab)n.classList.add('active');});
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    document.getElementById('page-title').textContent=tab.charAt(0).toUpperCase()+tab.slice(1);
}

async function renderGit(){

            <div class="hero-card"><div class="accent-line" style="background:var(--cyan)"></div><div class="label">Lines</div><div class="value" style="color:var(--cyan)">+${fmt(summary.totalInsertions)}</div><div class="sub">-${fmt(summary.totalDeletions)}</div></div>

async function generateReport(){
    if(!currentData)return;const s=currentData.summary,sub=currentData.subscription||{},apiVal=s.apiEquivalentCost||0,roi=sub.actualCost>0?(apiVal/sub.actualCost).toFixed(1):'N/A',p=currentData.projects||[];

    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Claude Radar Report</title><style>body{font-family:'Fira Sans',-apple-system,sans-serif;max-width:860px;margin:0 auto;padding:40px;color:#111;background:#fff}h1{font-size:26px;margin-bottom:2px}.sub{color:#666;margin-bottom:32px;font-size:13px}.sec{margin-bottom:28px}h2{font-size:16px;border-bottom:2px solid #e5e7eb;padding-bottom:6px;margin-bottom:14px}.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-bottom:18px}.k{background:#f8f9fc;border-radius:8px;padding:14px;text-align:center}.k .kv{font-size:22px;font-weight:700;font-family:'Fira Code',monospace;color:#4f8ff7}.k .kl{font-size:10px;color:#888;margin-top:3px;text-transform:uppercase}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;padding:7px;border-bottom:2px solid #e5e7eb;font-size:10px;text-transform:uppercase;color:#888}td{padding:7px;border-bottom:1px solid #f0f0f0}tr:hover td{background:#f8f9ff}.ft{margin-top:36px;font-size:10px;color:#bbb;text-align:center;border-top:1px solid #e5e7eb;padding-top:14px}</style></head><body><h1>Claude Radar Report</h1><div class="sub">Generated ${new Date().toLocaleString()} | ${sub.plan||'Unknown'} Plan</div><div class="sec"><h2>Summary</h2><div class="krow"><div class="k"><div class="kv">$${(sub.actualCost||0)}</div><div class="kl">Paid</div></div><div class="k"><div class="kv">$${apiVal.toFixed(2)}</div><div class="kl">API Value</div></div><div class="k"><div class="kv">${roi}x</div><div class="kl">ROI</div></div><div class="k"><div class="kv">${s.totalMessages.toLocaleString()}</div><div class="kl">Messages</div></div><div class="k"><div class="kv">${s.totalProjects}</div><div class="kl">Projects</div></div></div></div><div class="sec"><h2>Projects</h2><table><tr><th>Project</th><th style="text-align:right">Value</th><th style="text-align:right">Msgs</th><th style="text-align:right">Sessions</th><th style="text-align:right">Share</th></tr>${p.map(x=>`<tr><td><strong>${x.name}</strong></td><td style="text-align:right">$${x.totalCost.toFixed(2)}</td><td style="text-align:right">${x.totalMessages}</td><td style="text-align:right">${x.sessionCount}</td><td style="text-align:right">${(x.totalCost/apiVal*100).toFixed(1)}%</td></tr>`).join('')}</table></div>${gitHtml}<div class="ft">Claude Radar &middot; github.com/berenceylan/claude-radar</div></body></html>`;
    const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='claude-radar-report.html';a.click();URL.revokeObjectURL(url);showToast('Report downloaded');
}

function escAttr(s){if(!s)return'';return s.replace(/[&'"<>]/g,c=>({'&':'&amp;',"'":'&#39;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]));}
