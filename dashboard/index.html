<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Radar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Themes ──────────────────────────────────── */
        [data-theme="dark"] {
            --bg-0: #08090d; --bg-1: #0f1117; --bg-2: #171923; --bg-3: #1e2130;
            --border: #262a3a; --border-hover: #3b4060;
            --text-1: #eaecf4; --text-2: #8b8fa3; --text-3: #50546a;
            --glow: rgba(79,143,247,0.08);
        }
        [data-theme="light"] {
            --bg-0: #f0f2f7; --bg-1: #f8f9fc; --bg-2: #ffffff; --bg-3: #ffffff;
            --border: #dfe2ea; --border-hover: #c0c4d0;
            --text-1: #111827; --text-2: #4b5563; --text-3: #9ca3af;
            --glow: rgba(79,143,247,0.05);
        }
        [data-theme="contrast"] {
            --bg-0: #000; --bg-1: #0a0a0a; --bg-2: #141414; --bg-3: #1e1e1e;
            --border: #333; --border-hover: #555;
            --text-1: #fff; --text-2: #bbb; --text-3: #777;
            --glow: rgba(79,143,247,0.12);
        }
        :root {
            --blue: #4f8ff7; --purple: #a855f7; --green: #22c55e; --orange: #f59e0b;
            --red: #ef4444; --cyan: #06b6d4; --pink: #ec4899; --indigo: #6366f1;
            --radius: 10px; --transition: 180ms ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Fira Code', 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
            background: var(--bg-0); color: var(--text-1);
            min-height: 100vh; display: flex;
            -webkit-font-smoothing: antialiased;
            font-size: 13px;
        }

        /* ── Sidebar ─────────────────────────────────── */
        .sidebar {
            width: 220px; min-height: 100vh; background: var(--bg-1);
            border-right: 1px solid var(--border); padding: 20px 0;
            display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100;
        }
        .sidebar-brand { padding: 0 20px 24px; display: flex; align-items: center; gap: 10px; }
        .sidebar-brand svg { width: 28px; height: 28px; }
        .sidebar-brand span { font-size: 16px; font-weight: 700; background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar-nav { flex: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 20px; margin: 2px 8px; border-radius: 8px;
            font-size: 13px; font-weight: 500; color: var(--text-2);
            cursor: pointer; transition: all var(--transition); user-select: none;
        }
        .nav-item:hover { background: var(--glow); color: var(--text-1); }
        .nav-item.active { background: var(--glow); color: var(--blue); font-weight: 600; }
        .nav-item svg { width: 18px; height: 18px; opacity: 0.6; flex-shrink: 0; pointer-events: none; }
        .nav-item * { pointer-events: none; }
        .nav-item.active svg { opacity: 1; }
        .nav-section { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); padding: 16px 20px 6px; }
        .sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--border); }
        .sidebar-footer .meta { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

        /* ── Main Content ────────────────────────────── */
        .main { margin-left: 220px; flex: 1; min-height: 100vh; }
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: var(--bg-1); border-bottom: 1px solid var(--border);
            padding: 12px 28px; display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(12px);
        }
        .topbar-title { font-size: 15px; font-weight: 600; flex: 1; }
        .page { padding: 24px 28px; }

        /* ── Controls ────────────────────────────────── */
        .btn {
            background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2);
            padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 12px;
            font-family: inherit; transition: all var(--transition);
            display: inline-flex; align-items: center; gap: 5px;
        }
        .btn:hover { background: var(--bg-3); color: var(--text-1); border-color: var(--border-hover); }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
        .btn-primary:hover { opacity: .85; }
        .input {
            background: var(--bg-2); border: 1px solid var(--border); color: var(--text-1);
            padding: 6px 10px; border-radius: 7px; font-size: 12px; font-family: inherit; outline: none;
        }
        .input:focus { border-color: var(--blue); }
        .sep { width: 1px; height: 20px; background: var(--border); }

        /* ── Hero KPIs ───────────────────────────────── */
        .hero-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .hero-card {
            background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px 24px; position: relative; overflow: hidden;
            transition: border-color var(--transition);
        }
        .hero-card:hover { border-color: var(--border-hover); }
        .hero-card .label { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
        .hero-card .value { font-size: 32px; font-weight: 700; font-family: 'Fira Code', monospace; line-height: 1; }
        .hero-card .sub { font-size: 12px; color: var(--text-2); margin-top: 6px; }
        .hero-card .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 2px; }

        /* ── Stat Row ────────────────────────────────── */
        .stat-row { display: flex; gap: 24px; margin-bottom: 24px; padding: 14px 20px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); }
        .stat-item { display: flex; flex-direction: column; }
        .stat-item .s-val { font-size: 15px; font-weight: 600; font-family: 'Fira Code', monospace; }
        .stat-item .s-lbl { font-size: 11px; color: var(--text-3); margin-top: 2px; }

        /* ── Cards & Bento Grid ──────────────────────── */
        .bento { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-bottom: 16px; }
        .card {
            background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 18px; transition: border-color var(--transition);
        }
        .card:hover { border-color: var(--border-hover); }
        .card-header { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: .3px; display: flex; align-items: center; gap: 6px; }
        .help-tip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--text-3); color: var(--text-3); font-size: 9px; font-weight: 700; cursor: help; flex-shrink: 0; text-transform: none; letter-spacing: 0; }
        .help-tip:hover { border-color: var(--blue); color: var(--blue); }
        .help-tip .tip-text { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--bg-3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 11px; font-weight: 400; color: var(--text-1); white-space: normal; width: 220px; line-height: 1.5; z-index: 50; box-shadow: 0 4px 12px rgba(0,0,0,.3); text-transform: none; letter-spacing: 0; }
        .help-tip:hover .tip-text { display: block; }
        .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; }
        .span-6 { grid-column: span 6; } .span-12 { grid-column: span 12; }
        .chart-wrap { position: relative; width: 100%; }
        .chart-h-sm { height: 180px; } .chart-h-md { height: 240px; } .chart-h-lg { height: 300px; }

        /* ── Tables ──────────────────────────────────── */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
        tr { cursor: pointer; transition: background var(--transition); }
        tr:hover td { background: var(--glow); }
        .mono { font-family: 'Fira Code', monospace; font-size: 11px; }
        .text-right { text-align: right; }
        .project-name { font-weight: 600; color: var(--blue); }
        .project-path { font-size: 10px; color: var(--text-3); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-track { height: 4px; background: var(--border); border-radius: 2px; min-width: 60px; }
        .bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--purple)); }

        /* ── Git ─────────────────────────────────────── */
        .commit-hash { font-family: 'Fira Code', monospace; font-size: 11px; color: var(--orange); }
        .branch-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; background: rgba(168,85,247,.1); color: var(--purple); }
        .lines-add { color: var(--green); } .lines-del { color: var(--red); }

        /* ── Insights ────────────────────────────────── */
        .insight { padding: 14px 18px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid; }
        .insight.warning { background: rgba(245,158,11,.06); border-color: var(--orange); }
        .insight.info { background: rgba(79,143,247,.04); border-color: var(--blue); }
        .insight-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
        .insight-detail { font-size: 12px; color: var(--text-2); line-height: 1.5; }

        /* ── Sessions ────────────────────────────────── */
        .msg-timeline { max-height: 500px; overflow-y: auto; }
        .msg-item { padding: 8px 14px; border-left: 2px solid var(--border); margin-left: 8px; margin-bottom: 3px; font-size: 12px; transition: background var(--transition); }
        .msg-item:hover { background: var(--glow); }
        .msg-item.user { border-color: var(--blue); }
        .msg-item.assistant { border-color: var(--purple); }
        .msg-meta { font-size: 10px; color: var(--text-3); margin-bottom: 2px; font-family: 'Fira Code', monospace; }
        .msg-preview { color: var(--text-2); word-break: break-word; line-height: 1.5; }

        /* ── Modal ───────────────────────────────────── */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); z-index:1000; justify-content:center; align-items:center; }
        .modal-overlay.open { display:flex; }
        .modal { background:var(--bg-2); border:1px solid var(--border); border-radius:14px; padding:28px; width:400px; max-width:90vw; }
        .modal h2 { font-size:16px; font-weight:700; margin-bottom:20px; }
        .modal label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-3); margin-bottom:5px; }
        .modal select, .modal input { width:100%; background:var(--bg-1); border:1px solid var(--border); border-radius:7px; padding:9px 12px; color:var(--text-1); font-size:13px; font-family:inherit; margin-bottom:14px; outline:none; }
        .modal select:focus, .modal input:focus { border-color:var(--blue); }
        .modal-actions { display:flex; gap:8px; justify-content:flex-end; }

        /* ── Toast ───────────────────────────────────── */
        .toast { position:fixed; bottom:24px; right:24px; background:var(--bg-3); border:1px solid var(--green); color:var(--text-1); padding:10px 18px; border-radius:8px; font-size:12px; z-index:1001; opacity:0; transform:translateY(10px); transition:all .3s; font-family:'Fira Code',monospace; }
        .toast.show { opacity:1; transform:translateY(0); }

        /* ── Tab Content ─────────────────────────────── */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Loading ─────────────────────────────────── */
        .loading { display:flex; justify-content:center; align-items:center; height:300px; color:var(--text-3); }
        .spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; margin-right:10px; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* ── Heatmap ────────────────────────────────── */
        .heatmap-grid{display:grid;grid-template-columns:36px repeat(24,1fr);gap:2px;font-size:9px}
        .heatmap-cell{border-radius:2px;height:18px}
        .heatmap-label{display:flex;align-items:center;color:var(--text-3);font-size:9px}
        .heatmap-hours{display:grid;grid-template-columns:36px repeat(24,1fr);gap:2px;margin-bottom:2px}

        /* ── Efficiency Badge ───────────────────────── */
        .eff-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;font-family:'Fira Code',monospace}

        /* ── Simulator ──────────────────────────────── */
        .sim-slider-wrap{margin-bottom:20px}
        .sim-slider-wrap label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
        .sim-slider-wrap input[type=range]{width:100%;accent-color:var(--blue)}
        .sim-result{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
        .sim-card{flex:1;min-width:140px;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
        .sim-card .sv{font-size:20px;font-weight:700;font-family:'Fira Code',monospace}
        .sim-card .sl{font-size:10px;color:var(--text-3);margin-top:3px;text-transform:uppercase}

        /* ── Subagent Tree ──────────────────────────── */
        .tree-node{margin-left:18px;border-left:1px solid var(--border);padding-left:12px;margin-bottom:4px}
        .tree-toggle{cursor:pointer;user-select:none;font-size:12px;padding:4px 0;display:flex;align-items:center;gap:6px}
        .tree-toggle:hover{color:var(--blue)}
        .tree-cost-bar{display:inline-block;height:6px;border-radius:3px;background:var(--purple);margin-left:8px}

        /* ── Responsive ──────────────────────────────── */
        @media (max-width:1200px) { .bento { grid-template-columns: repeat(6,1fr); } .span-8,.span-4 { grid-column: span 6; } }
        @media (max-width:768px) {
            .sidebar { display:none; }
            .main { margin-left:0; }
            .hero-kpis { grid-template-columns: 1fr; }
            .bento { grid-template-columns: 1fr; }
            .span-8,.span-4,.span-6,.span-12 { grid-column: span 1; }
            .stat-row { flex-wrap: wrap; }
            .page { padding: 16px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; } }
    </style>
</head>
<body>

    <!-- Main -->
    <div class="main">
        <div class="topbar">
            <div class="topbar-title" id="page-title">Overview</div>
            <input type="date" class="input" id="start-date" title="Start date">
            <input type="date" class="input" id="end-date" title="End date">
            <button class="btn" onclick="applyDateFilter()">Filter</button>
            <button class="btn" onclick="clearDateFilter()">Reset</button>
            <div class="sep"></div>
            <button class="btn" id="btn-regen" onclick="regenerate()">Refresh</button>
            <button class="btn" onclick="exportData('json')">JSON</button>
            <button class="btn" onclick="exportData('csv')">CSV</button>
            <button class="btn" onclick="generateReport()">Report</button>
            <button class="btn" onclick="openSettings()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <select class="input" id="theme-select" onchange="setTheme(this.value)" style="width:auto;padding-right:24px">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="contrast">Contrast</option>
            </select>
        </div>

        <div class="tab-content" id="tab-live"><div id="live-app" style="position:relative;height:calc(100vh - 49px);overflow:hidden"><canvas id="live-canvas" style="display:block;width:100%;height:100%"></canvas></div></div>
        <div class="tab-content active" id="tab-overview"><div class="page" id="overview-app"><div class="loading"><div class="spinner"></div>Loading...</div></div></div>
        <div class="tab-content" id="tab-sessions"><div class="page" id="sessions-app"></div></div>
        <div class="tab-content" id="tab-tools"><div class="page" id="tools-app"></div></div>
        <div class="tab-content" id="tab-project"><div class="page" id="project-app"></div></div>
        <div class="tab-content" id="tab-git"><div class="page" id="git-app"></div></div>
        <div class="tab-content" id="tab-insights"><div class="page" id="insights-app"></div></div>
        <div class="tab-content" id="tab-simulator"><div class="page" id="simulator-app"></div></div>
    </div>

    <!-- Shortcuts Modal -->
    <div class="modal-overlay" id="shortcuts-modal">
        <div class="modal">
            <h2>Keyboard Shortcuts</h2>
            <table>
                <tr><td class="mono" style="width:60px">1-7</td><td>Switch tabs</td></tr>
                <tr><td class="mono">?</td><td>Show this help</td></tr>
                <tr><td class="mono">r</td><td>Refresh data</td></tr>
                <tr><td class="mono">Esc</td><td>Close modal</td></tr>
            </table>
            <div class="modal-actions" style="margin-top:14px"><button class="btn" onclick="document.getElementById('shortcuts-modal').classList.remove('open')">Close</button></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Settings</h2>
            <label>Subscription Plan</label>
            <select id="setting-plan" onchange="toggleCustomRate()">
                <option value="pro_20">Pro - $20/month</option>
                <option value="max_100">Max - $100/month</option>
                <option value="max_200">Max - $200/month</option>
                <option value="team">Team - Custom rate</option>
            </select>
            <div id="custom-rate-row" style="display:none">
                <label>Monthly Rate ($)</label>
                <input type="number" id="setting-rate" placeholder="e.g. 150" />
            </div>
            <label>Monthly Budget (API value $)</label>
            <input type="number" id="setting-budget" placeholder="e.g. 500" />
            <div class="modal-actions">
                <button class="btn" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

<script>
// ── Globals ──────────────────────────────────────
const COLORS={blue:'#4f8ff7',purple:'#a855f7',green:'#22c55e',orange:'#f59e0b',red:'#ef4444',cyan:'#06b6d4',pink:'#ec4899',indigo:'#6366f1',lime:'#84cc16',amber:'#d97706',teal:'#14b8a6',rose:'#f43f5e'};
const PALETTE=Object.values(COLORS);
const PLAN_RATES={pro_20:20,max_100:100,max_200:200};
let currentData=null,charts={},dateFilter={};

// ── Formatters ───────────────────────────────────
function fmt(n,d=0){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toFixed(d);}
function fmtCost(n){return'$'+(n||0).toFixed(2);}
function fmtTokens(n){if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n||0);}
function fmtDate(s){return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function tip(t){return`<span class="help-tip">?<span class="tip-text">${t}</span></span>`;}
const TIPS={
  dailyCost:'Daily API-equivalent cost based on token usage and model pricing.',
  byProject:'Cost distribution across your projects. Hover for exact values.',
  tokensIO:'Input tokens (your prompts) vs output tokens (Claude responses) per day.',
  modelDist:'How many messages each Claude model handled.',
  cache:'Cache read tokens (free reuse) vs cache write tokens (new context stored).',
  msgsDay:'Number of messages exchanged with Claude per day.',
  costModel:'Total API-equivalent cost attributed to each model.',
  projDaily:'Daily token consumption broken down by project.',
  cumulative:'Running total of API value generated over time.',
  projTable:'All projects ranked by cost with token breakdown and share.',
  modelTable:'Per-model token and cost breakdown.',
  gantt:'Visual timeline showing when each session started and ended.',
  sessionList:'All sessions with project, branch, duration, and cost.',
  clusters:'Sessions auto-classified by work type based on tool usage patterns.',
  gitProj:'AI cost attributed to each project via git commit correlation.',
  gitTimeline:'Daily commit cost trend broken down by project.',
  gitBranch:'Cost breakdown by git branch.',
  gitExpensive:'Commits ranked by estimated AI cost.',
  costPerLine:'How much each line of code cost in AI assistance.',
  cplTrend:'Daily trend of cost per changed line of code.',
  toolUsage:'Distribution of Claude Code tool invocations.',
  toolBar:'Tools ranked by total call count.',
  toolTable:'All tools with call count, session spread, and project spread.',
  subagents:'Subagents spawned during sessions with their cost.',
  subTree:'Session-to-subagent hierarchy showing cost at each level.',
  insights:'Automated analysis of your usage patterns with actionable tips.',
  heatmap:'When you use Claude most — by hour and day of week.',
  simModel:'Estimate savings by shifting usage between models.',
  simCache:'Estimate savings from improved cache hit rates.',
  bookmarks:'Sessions you bookmarked for quick access.',
  efficiency:'A-F grade based on cache usage, output ratio, and cost per message.',
};
function fmtDateTime(s){if(!s)return'-';return new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}

// ── Efficiency & Duration ────────────────────────
function calcEfficiency(s){
  const inp=s.total_input_tokens||0,out=s.total_output_tokens||0,cr=s.total_cache_read||0;
  const ioScore=Math.min((out/Math.max(inp,1))/0.5,1);
  const totalIn=inp+cr;const cacheScore=totalIn>0?cr/totalIn:0;
  const cpm=s.message_count>0?(s.total_cost||0)/s.message_count:1;
  const costScore=Math.max(0,1-cpm/0.5);
  const score=ioScore*0.3+cacheScore*0.4+costScore*0.3;
  const grades=['F','D','C','B','A'];
  return{score:Math.round(score*100),grade:grades[Math.min(Math.floor(score*5),4)]};
}
function gradeColor(g){return{A:'#22c55e',B:'#06b6d4',C:'#f59e0b',D:'#ef4444',F:'#ef4444'}[g]||'#8b8fa3';}
function fmtDuration(s){
  if(!s||!s.first_timestamp||!s.last_timestamp)return'-';
  const mins=Math.round((new Date(s.last_timestamp)-new Date(s.first_timestamp))/60000);
  if(mins<0)return'-';
  return mins>=60?Math.floor(mins/60)+'h '+mins%60+'m':mins+'m';
}
function sessionCostPerHr(s){
  if(!s||!s.first_timestamp||!s.last_timestamp)return null;
  const hrs=(new Date(s.last_timestamp)-new Date(s.first_timestamp))/3600000;
  return hrs>0?(s.total_cost||0)/hrs:null;
}

// ── Chart config ─────────────────────────────────
Chart.defaults.color='#8b8fa3';Chart.defaults.borderColor='rgba(42,45,62,0.4)';
Chart.defaults.font.family="'Fira Code','SF Mono',monospace";Chart.defaults.font.size=11;
Chart.defaults.plugins.legend.labels.usePointStyle=true;Chart.defaults.plugins.legend.labels.pointStyleWidth=8;
Chart.defaults.plugins.legend.labels.padding=12;
const gridColor='rgba(42,45,62,0.25)';

// ── Navigation ───────────────────────────────────
const navItems=document.querySelectorAll('.nav-item[data-tab]');
const tabContents=document.querySelectorAll('.tab-content');
const pageTitle=document.getElementById('page-title');
navItems.forEach(item=>{
    item.addEventListener('click',()=>{
        navItems.forEach(n=>n.classList.remove('active'));
        tabContents.forEach(t=>t.classList.remove('active'));
        item.classList.add('active');
        const tab=item.dataset.tab;
        document.getElementById('tab-'+tab).classList.add('active');
        pageTitle.textContent=item.textContent.trim();
        if(tab==='live')initLive();else destroyLive();
        if(tab==='sessions'&&currentData)renderSessions();
        if(tab==='tools'&&currentData)renderTools();
        if(tab==='git')renderGit();
        if(tab==='project')renderProjectPicker();
        if(tab==='insights')renderInsights();
        if(tab==='simulator')renderSimulator();
    });
});

// ── Theme ────────────────────────────────────────
function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('radar-theme',t);}
const savedTheme=localStorage.getItem('radar-theme');if(savedTheme){setTheme(savedTheme);document.getElementById('theme-select').value=savedTheme;}

// ── Date Filter ──────────────────────────────────
function applyDateFilter(){dateFilter.startDate=document.getElementById('start-date').value||undefined;dateFilter.endDate=document.getElementById('end-date').value||undefined;loadAndRender();}
function clearDateFilter(){dateFilter={};document.getElementById('start-date').value='';document.getElementById('end-date').value='';loadAndRender();}

// ── Toast / Settings ─────────────────────────────
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
async function openSettings(){const r=await fetch('/api/config');const{config}=await r.json();document.getElementById('setting-plan').value=config.plan||'max_100';document.getElementById('setting-rate').value=config.monthlyRate||'';document.getElementById('setting-budget').value=config.monthlyBudget||'';toggleCustomRate();document.getElementById('settings-modal').classList.add('open');}
function closeSettings(){document.getElementById('settings-modal').classList.remove('open');}
function toggleCustomRate(){document.getElementById('custom-rate-row').style.display=document.getElementById('setting-plan').value==='team'?'block':'none';}
document.getElementById('settings-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSettings();});
async function saveSettings(){const plan=document.getElementById('setting-plan').value;const rate=plan==='team'?parseFloat(document.getElementById('setting-rate').value)||0:PLAN_RATES[plan]||100;const budget=parseFloat(document.getElementById('setting-budget').value)||0;await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,monthlyRate:rate,monthlyBudget:budget})});closeSettings();showToast('Settings saved');loadAndRender();}

function exportData(f){const p=new URLSearchParams(dateFilter);window.open('/api/export/'+f+'?'+p.toString());}
async function regenerate(){const b=document.getElementById('btn-regen');b.disabled=true;try{await fetch('/api/regenerate',{method:'POST'});await loadAndRender();showToast('Data refreshed');}finally{b.disabled=false;}}

// ── Data ─────────────────────────────────────────
async function loadData(){const p=new URLSearchParams(dateFilter);return(await fetch('/api/data?'+p)).json();}
async function loadAndRender(){currentData=await loadData();renderOverview(currentData);}
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={};}

// ── OVERVIEW ─────────────────────────────────────
function renderOverview(data){
    destroyCharts();
    const app=document.getElementById('overview-app');
    const s=data.summary,sub=data.subscription||{plan:'Max',monthlyRate:100,monthsActive:1,actualCost:100};
    const apiVal=s.apiEquivalentCost||0,roi=sub.actualCost>0?(apiVal/sub.actualCost):0;
    const cacheEff=s.totalTokens>0?((s.totalCacheRead/s.totalTokens)*100).toFixed(1):0;

    document.getElementById('sidebar-meta').innerHTML=`Live &middot; ${s.totalProjects} projects`;

    app.innerHTML=`
        <div class="hero-kpis">
            <div class="hero-card"><div class="accent-line" style="background:var(--green)"></div><div class="label">You Paid (${escHtml(sub.plan)})</div><div class="value" style="color:var(--green)">${fmtCost(sub.actualCost)}</div><div class="sub">${fmtCost(sub.monthlyRate)}/mo &times; ${sub.monthsActive} months</div></div>
            <div class="hero-card"><div class="accent-line" style="background:var(--blue)"></div><div class="label">API Equivalent Value</div><div class="value" style="color:var(--blue)">${fmtCost(apiVal)}</div><div class="sub">${fmtCost(s.totalMessages>0?apiVal/s.totalMessages:0)} per message</div></div>
            <div class="hero-card"><div class="accent-line" style="background:var(--purple)"></div><div class="label">Return on Investment</div><div class="value" style="color:var(--purple)">${roi.toFixed(1)}x</div><div class="sub">You got ${fmtCost(apiVal-sub.actualCost)} more value</div></div>
        </div>
        <div class="stat-row">
            <div class="stat-item"><div class="s-val" style="color:var(--cyan)">${fmtTokens(s.totalTokens)}</div><div class="s-lbl">Total Tokens</div></div>
            <div class="stat-item"><div class="s-val">${fmt(s.totalMessages)}</div><div class="s-lbl">Messages</div></div>
            <div class="stat-item"><div class="s-val">${s.totalSessions}</div><div class="s-lbl">Sessions</div></div>
            <div class="stat-item"><div class="s-val">${s.totalProjects}</div><div class="s-lbl">Projects</div></div>
            <div class="stat-item"><div class="s-val" style="color:var(--green)">${cacheEff}%</div><div class="s-lbl">Cache Hit Rate</div></div>
            <div class="stat-item"><div class="s-val">${data.dailyUsage.length}</div><div class="s-lbl">Active Days</div></div>
            <div class="stat-item"><div class="s-val">${fmtTokens(s.totalInputTokens)}</div><div class="s-lbl">Input</div></div>
            <div class="stat-item"><div class="s-val">${fmtTokens(s.totalOutputTokens)}</div><div class="s-lbl">Output</div></div>
        </div>
        <div class="bento">
            <div class="card span-8"><div class="card-header">Daily API Value ${tip(TIPS.dailyCost)}</div><div class="chart-wrap chart-h-lg"><canvas id="c-daily-cost"></canvas></div></div>
            <div class="card span-4"><div class="card-header">By Project ${tip(TIPS.byProject)}</div><div class="chart-wrap chart-h-lg"><canvas id="c-project-pie"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-6"><div class="card-header">Tokens (Input vs Output) ${tip(TIPS.tokensIO)}</div><div class="chart-wrap chart-h-md"><canvas id="c-daily-tokens"></canvas></div></div>
            <div class="card span-6"><div class="card-header">Model Distribution ${tip(TIPS.modelDist)}</div><div class="chart-wrap chart-h-md"><canvas id="c-model-dist"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-4"><div class="card-header">Cache Read / Write ${tip(TIPS.cache)}</div><div class="chart-wrap chart-h-sm"><canvas id="c-cache"></canvas></div></div>
            <div class="card span-4"><div class="card-header">Messages Per Day ${tip(TIPS.msgsDay)}</div><div class="chart-wrap chart-h-sm"><canvas id="c-msgs-day"></canvas></div></div>
            <div class="card span-4"><div class="card-header">Cost Per Model ${tip(TIPS.costModel)}</div><div class="chart-wrap chart-h-sm"><canvas id="c-model-cost"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-12"><div class="card-header">Daily Tokens by Project ${tip(TIPS.projDaily)}</div><div class="chart-wrap" style="height:${Math.max(240,data.projects.length*14)}px"><canvas id="c-proj-daily"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-12"><div class="card-header">Cumulative Value ${tip(TIPS.cumulative)}</div><div class="chart-wrap chart-h-md"><canvas id="c-cumulative"></canvas></div></div>
        </div>
        <div class="bento">
            <div class="card span-12"><div class="card-header">Project Breakdown ${tip(TIPS.projTable)}</div>
                <div style="overflow-x:auto"><table><thead><tr>
                    <th>Project</th><th class="text-right">API Value</th><th class="text-right">Msgs</th><th class="text-right">Sessions</th>
                    <th class="text-right">Input</th><th class="text-right">Output</th><th class="text-right">Cache R</th><th class="text-right">Cache W</th>
                    <th style="min-width:80px" class="text-right">Share</th><th class="text-right">Last</th>
                </tr></thead><tbody id="proj-tbody"></tbody></table></div>
            </div>
        </div>
        <div class="bento">
            <div class="card span-12"><div class="card-header">Model Breakdown ${tip(TIPS.modelTable)}</div>
                <div style="overflow-x:auto"><table><thead><tr>
                    <th>Model</th><th class="text-right">Messages</th><th class="text-right">Input</th><th class="text-right">Output</th>
                    <th class="text-right">Cache R</th><th class="text-right">Cache W</th><th class="text-right">Value</th><th class="text-right">Share</th>
                </tr></thead><tbody id="model-tbody"></tbody></table></div>
            </div>
        </div>`;

    // Heatmap
    fetch('/api/heatmap?'+new URLSearchParams(dateFilter)).then(r=>r.json()).then(hm=>{
      if(!hm||!hm.length)return;
      const maxCount=Math.max(1,...hm.map(h=>h.messages));
      const grid={};hm.forEach(h=>{grid[h.day_of_week+'_'+h.hour]=h.messages;});
      const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      let cells='';
      for(let d=0;d<7;d++){
        cells+=`<div class="heatmap-label">${dayNames[d]}</div>`;
        for(let h=0;h<24;h++){
          const c=grid[d+'_'+h]||0;
          const op=c>0?Math.max(0.1,c/maxCount):0.02;
          cells+=`<div class="heatmap-cell" style="background:rgba(79,143,247,${op.toFixed(2)})" title="${dayNames[d]} ${h}:00 — ${c} msgs"></div>`;
        }
      }
      let hourLabels='<div></div>';
      for(let h=0;h<24;h++)hourLabels+=`<div style="text-align:center;font-size:8px;color:var(--text-3)">${h%2===0?h:''}</div>`;
      const hmCard=document.createElement('div');
      hmCard.className='card';hmCard.style.marginBottom='16px';
      hmCard.innerHTML=`<div class="card-header">Activity Heatmap ${tip(TIPS.heatmap)}</div><div class="heatmap-hours">${hourLabels}</div><div class="heatmap-grid">${cells}</div>`;
      const statRow=app.querySelector('.stat-row');
      const afterEl=statRow?.nextElementSibling?.classList?.contains('card')?statRow.nextElementSibling:statRow;
      if(afterEl)afterEl.after(hmCard);
    }).catch(()=>{});

    const dl=data.dailyUsage,p=data.projects,mu=data.modelUsage;
    const dates=dl.map(d=>fmtDate(d.date));

    charts.dailyCost=new Chart(el('c-daily-cost'),{type:'bar',data:{labels:dates,datasets:[{data:dl.map(d=>d.cost),backgroundColor:COLORS.blue+'88',borderRadius:3,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtCost(c.parsed.y)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:gridColor}},x:{grid:{display:false}}}}});

    const top8=p.slice(0,8),otherCost=p.slice(8).reduce((s,x)=>s+x.totalCost,0);
    const pieL=[...top8.map(x=>x.name)],pieD=[...top8.map(x=>x.totalCost)];
    if(otherCost>0){pieL.push('Others');pieD.push(otherCost);}
    charts.projPie=new Chart(el('c-project-pie'),{type:'doughnut',data:{labels:pieL,datasets:[{data:pieD,backgroundColor:PALETTE.slice(0,pieL.length),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{font:{size:10},padding:8}}}}});

    charts.dailyTokens=new Chart(el('c-daily-tokens'),{type:'bar',data:{labels:dates,datasets:[{label:'Input',data:dl.map(d=>d.inputTokens),backgroundColor:COLORS.blue+'88',stack:'s'},{label:'Output',data:dl.map(d=>d.outputTokens),backgroundColor:COLORS.purple+'88',stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:gridColor}},x:{stacked:true,grid:{display:false}}}}});

    const models=Object.entries(mu).filter(([k])=>k!=='<synthetic>');
    charts.modelDist=new Chart(el('c-model-dist'),{type:'doughnut',data:{labels:models.map(([k])=>k.replace('claude-','')),datasets:[{data:models.map(([,v])=>v.messages),backgroundColor:PALETTE,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{font:{size:10},padding:8}}}}});

    charts.cache=new Chart(el('c-cache'),{type:'bar',data:{labels:dates,datasets:[{label:'Read',data:dl.map(d=>d.cacheRead),backgroundColor:COLORS.green+'70',stack:'s'},{label:'Write',data:dl.map(d=>d.cacheWrite),backgroundColor:COLORS.orange+'70',stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:gridColor}},x:{stacked:true,grid:{display:false}}}}});

    charts.msgsDay=new Chart(el('c-msgs-day'),{type:'line',data:{labels:dates,datasets:[{data:dl.map(d=>d.messages),borderColor:COLORS.purple,backgroundColor:COLORS.purple+'15',fill:true,tension:.4,pointRadius:1.5,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:gridColor}},x:{grid:{display:false}}}}});

    const mSorted=models.sort(([,a],[,b])=>b.cost-a.cost);
    charts.modelCost=new Chart(el('c-model-cost'),{type:'bar',data:{labels:mSorted.map(([k])=>k.replace('claude-','')),datasets:[{data:mSorted.map(([,v])=>v.cost),backgroundColor:PALETTE,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtCost(c.parsed.x)}}},scales:{x:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:gridColor}},y:{grid:{display:false}}}}});

    const pdt=data.projectDailyTokens||[];
    const allDates=[...new Set(pdt.map(r=>r.date))].sort();
    const topProj=[...new Set(p.slice(0,8).map(x=>x.name))];
    const pdDS=topProj.map((name,i)=>{const map={};pdt.filter(r=>r.project_name===name).forEach(r=>map[r.date]=r.tokens);return{label:name,data:allDates.map(d=>map[d]||0),backgroundColor:PALETTE[i]+'80',stack:'s'};});
    charts.projDaily=new Chart(el('c-proj-daily'),{type:'bar',data:{labels:allDates.map(fmtDate),datasets:pdDS},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10}}}},scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtTokens(v)},grid:{color:gridColor}},x:{stacked:true,grid:{display:false}}}}});

    let cum=0;const cumD=dl.map(d=>{cum+=d.cost;return cum;});
    charts.cumulative=new Chart(el('c-cumulative'),{type:'line',data:{labels:dates,datasets:[{data:cumD,borderColor:COLORS.red,backgroundColor:COLORS.red+'10',fill:true,tension:.3,pointRadius:1.5,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v)},grid:{color:gridColor}},x:{grid:{display:false}}}}});

    const maxCost=p[0]?.totalCost||1;
    document.getElementById('proj-tbody').innerHTML=p.map(x=>`<tr onclick="navTo('project');renderProjectDetail(${x.id})" style="cursor:pointer">
        <td><div class="project-name">${escHtml(x.name)}</div><div class="project-path" title="${escAttr(x.path)}">${escHtml(x.path)}</div></td>
        <td class="text-right mono">${fmtCost(x.totalCost)}</td><td class="text-right mono">${fmt(x.totalMessages)}</td>
        <td class="text-right mono">${x.sessionCount}</td><td class="text-right mono">${fmtTokens(x.totalInputTokens)}</td>
        <td class="text-right mono">${fmtTokens(x.totalOutputTokens)}</td><td class="text-right mono">${fmtTokens(x.totalCacheRead)}</td>
        <td class="text-right mono">${fmtTokens(x.totalCacheWrite)}</td>
        <td class="text-right"><div class="bar-track"><div class="bar-fill" style="width:${(x.totalCost/maxCost*100).toFixed(1)}%"></div></div><div style="font-size:10px;color:var(--text-3);margin-top:2px">${(x.totalCost/apiVal*100).toFixed(1)}%</div></td>
        <td class="text-right mono" style="font-size:10px;color:var(--text-2)">${x.lastActivity?fmtDate(x.lastActivity):'-'}</td>
    </tr>`).join('');

    document.getElementById('model-tbody').innerHTML=models.map(([name,m])=>`<tr>

// Feature 14: Project Comparison
let compareMode=false;
let compareSelected=[];
function toggleCompareMode(){
    compareMode=!compareMode;
    compareSelected=[];
    const actions=document.getElementById('compare-actions');
    const result=document.getElementById('compare-result');
    if(actions)actions.style.display=compareMode?'block':'none';
    if(result)result.innerHTML='';
    document.querySelectorAll('.project-card').forEach(c=>{c.classList.remove('compare-selected');c.style.borderColor='var(--border)';});
}
function handleProjectClick(e,projectId){
    if(!compareMode){renderProjectDetail(projectId);return;}
    const card=e.currentTarget;
    if(card.classList.contains('compare-selected')){
        card.classList.remove('compare-selected');card.style.borderColor='var(--border)';
        compareSelected=compareSelected.filter(id=>id!==projectId);
    }else{
        if(compareSelected.length>=2)return;
        card.classList.add('compare-selected');card.style.borderColor='var(--purple)';
        compareSelected.push(projectId);
    }
}

// Helper to navigate to a tab programmatically
function navTo(tab){
    document.querySelectorAll('.nav-item[data-tab]').forEach(n=>{n.classList.remove('active');if(n.dataset.tab===tab)n.classList.add('active');});
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    document.getElementById('page-title').textContent=tab.charAt(0).toUpperCase()+tab.slice(1);
}

// ── INSIGHTS ─────────────────────────────────────
async function renderInsights(){
    const app=document.getElementById('insights-app');
    app.innerHTML='<div class="loading"><div class="spinner"></div></div>';
    const insights=await(await fetch('/api/insights')).json();
    if(!insights.length){app.innerHTML='<div class="card" style="padding:48px;text-align:center;color:var(--text-3)">No insights yet. Keep using Claude Code!</div>';return;}
    app.innerHTML=`<div class="card"><div class="card-header">Insights (${insights.length})</div>${insights.map(i=>`<div class="insight ${i.severity}"><div class="insight-title">${escHtml(i.title)}</div><div class="insight-detail">${escHtml(i.detail)}</div></div>`).join('')}</div>`;

    // Feature 9: Model Recommendations
    try{
        const recs=await(await fetch('/api/recommendations')).json();
        if(recs&&(recs.totalSavings>0||recs.recommendations&&recs.recommendations.length)){
            let recHtml=`<div class="card" style="margin-top:16px"><div class="card-header">Model Optimization ${tip('Sessions that could use a cheaper model without sacrificing quality.')}</div>
                <div class="insight info"><div class="insight-title">Potential Savings: ${fmtCost(recs.totalSavings||0)}</div>
                <div class="insight-detail">${recs.summary?escHtml(recs.summary):'Based on your usage patterns, some sessions could use cheaper models.'}</div></div>`;
            if(recs.recommendations&&recs.recommendations.length){
                recHtml+=`<table style="margin-top:12px"><thead><tr><th>Session / Project</th><th>Current Model</th><th>Suggested</th><th class="text-right">Potential Savings</th></tr></thead><tbody>`;
                recs.recommendations.slice(0,5).forEach(r=>{
                    recHtml+=`<tr><td class="project-name">${escHtml(r.project_name||r.session_id||'')}</td><td class="mono" style="font-size:10px">${escHtml((r.current_model||'').replace('claude-',''))}</td><td class="mono" style="font-size:10px;color:var(--green)">${escHtml((r.suggested_model||'').replace('claude-',''))}</td><td class="text-right mono">${fmtCost(r.savings||0)}</td></tr>`;
                });
                recHtml+=`</tbody></table>`;
            }
            recHtml+='</div>';
            app.insertAdjacentHTML('beforeend',recHtml);
        }
    }catch(e){/* recommendations API may not exist yet */}
}

  skyHue:220,gaugeAnim:0,gauge5hAnim:0,
  rateHist:new Float32Array(200),rateIdx:0,
  lastRefresh:0,
  stats:{rate:0,totalTokens:0,cost:0,cacheRate:0,model:'—',msgs:0,input:0,output:0,
    billingPct:0,billingLabel:'',
    window5hPct:0,window5hRemain:'',window5hRestart:'',
    projects:0}
};

function initLive(){
  if(live.active)return;
  live.active=true;
  const c=document.getElementById('live-canvas');
  const p=c.parentElement;
  c.width=p.clientWidth;c.height=p.clientHeight;
  live.ctx=c.getContext('2d');live.w=c.width;live.h=c.height;
  window.addEventListener('resize',resizeLive);
  fetchLiveData().then(()=>liveLoop());
  live.pollTimer=setInterval(()=>{if(live.active)fetchLiveData();},5000);
}
function destroyLive(){
  live.active=false;
  if(live.raf)cancelAnimationFrame(live.raf);
  live.raf=null;
  if(live.pollTimer)clearInterval(live.pollTimer);
  live.pollTimer=null;
  window.removeEventListener('resize',resizeLive);
}
function resizeLive(){
  if(!live.active)return;
  const c=document.getElementById('live-canvas');
  const p=c.parentElement;
  c.width=p.clientWidth;c.height=p.clientHeight;
  live.w=c.width;live.h=c.height;
}

async function fetchLiveData(){
  try{
    const [data, liveData] = await Promise.all([
      fetch('/api/data').then(r=>r.json()),
      fetch('/api/live').then(r=>r.json()).catch(()=>({}))
    ]);
    const s=data.summary,sub=data.subscription||{};
    const prev=live.prevData;

    // Calculate deltas for animation
    const newTot=(s.totalInputTokens||0)+(s.totalOutputTokens||0);
    const delta=prev?newTot-(prev.totalInputTokens||0)-(prev.totalOutputTokens||0):0;
    const dt=(Date.now()-live.lastRefresh)/1000||1;
    live.stats.rate=delta>0?Math.floor(delta/dt):live.stats.rate;
    live.rateHist[live.rateIdx%200]=live.stats.rate;live.rateIdx++;

    // Seed sparkline with historical daily data on first load
    if(!prev&&data.dailyUsage&&data.dailyUsage.length>0){
      const daily=data.dailyUsage.slice(-30);
      daily.forEach((d,i)=>{
        const tokens=(d.inputTokens||0)+(d.outputTokens||0);
        live.rateHist[i%200]=Math.floor(tokens/300);// approximate tok/sec over a day
      });
      live.rateIdx=Math.max(live.rateIdx,daily.length);
    }

    live.stats.totalTokens=s.totalTokens||0;
    live.stats.cost=s.apiEquivalentCost||0;
    live.stats.msgs=s.totalMessages||0;
    live.stats.input=s.totalInputTokens||0;
    live.stats.output=s.totalOutputTokens||0;
    live.stats.model=Object.keys(data.modelUsage||{}).sort((a,b)=>(data.modelUsage[b].messages||0)-(data.modelUsage[a].messages||0))[0]||'—';
    live.stats.projects=s.totalProjects||0;
    const totalIn=(s.totalInputTokens||0)+(s.totalCacheRead||0);
    live.stats.cacheRate=totalIn>0?((s.totalCacheRead||0)/totalIn*100):0;

    // Gauge 1: Billing period (monthly) — show days left
    if(sub.monthlyRate>0){
      const daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
      const dayOfMonth=new Date().getDate();
      const daysLeft=daysInMonth-dayOfMonth;
      live.stats.billingPct=Math.min(100,dayOfMonth/daysInMonth*100);
      live.stats.billingLabel=daysLeft+' days left';
    }else{
      live.stats.billingPct=0;
      live.stats.billingLabel='no plan';
    }

    // 5-hour billing window — use real rate limit data from statusline hook
    const bw=liveData.billingWindow;
    const rl=liveData.rateLimits;
    if(rl&&rl.usedPct!=null){
      // Real data from Claude's statusline
      live.stats.window5hPct=Math.round(rl.usedPct);
      live.stats.window5hRemain=(bw?bw.msgs+' msgs':'');
      if(rl.resetsAt){
        const rt=new Date(rl.resetsAt*1000);
        live.stats.window5hResetLabel='resets '+rt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      }else{live.stats.window5hResetLabel='';}
    }else if(bw&&bw.msgs>0){
      // No statusline data — show msgs only, no fake %
      live.stats.window5hPct=0;
      live.stats.window5hRemain=bw.msgs+' msgs';
      live.stats.window5hResetLabel='setup statusline for %';
    }else{
      live.stats.window5hPct=0;
      live.stats.window5hRemain='idle';
      live.stats.window5hResetLabel='';
    }

    // Buildings: scale heights proportionally — tallest = most cost
    const projs=data.projects||[];
    const maxCost=Math.max(1,...projs.map(p=>p.totalCost||0));
    const maxBuildingH=500;

    if(live.buildings.length===0){
      live.buildings=projs.slice(0,12).map((p,i)=>({
        name:p.name||'unknown',
        height:20+((p.totalCost||0)/maxCost)*maxBuildingH,
        cost:p.totalCost||0,
        color:PALETTE[i%PALETTE.length],
        windows:[]
      }));
    }else{
      projs.slice(0,12).forEach((p,i)=>{
        const targetH=20+((p.totalCost||0)/maxCost)*maxBuildingH;
        if(i<live.buildings.length){
          const b=live.buildings[i];
          const oldCost=b.cost;
          const newCost=p.totalCost||0;
          b.height+=(targetH-b.height)*0.15;
          if(newCost>oldCost){
            const isBurst=(newCost-oldCost)>1;
            for(let j=0;j<(isBurst?6:2);j++){
              b.windows.push({y:Math.random(),alpha:1,flicker:Math.random()*0.5+0.5});
            }
          }
          b.cost=newCost;
          b.name=p.name||b.name;
        }else{
          live.buildings.push({
            name:p.name||'unknown',height:targetH,
            cost:p.totalCost||0,
            color:PALETTE[i%PALETTE.length],windows:[]
          });
        }
      });
    }

    // Spawn effects on delta
    if(delta>0&&prev){
      const isBurst=delta>10000;
      if((s.totalCacheRead||0)>(prev.totalCacheRead||0)){
        for(let i=0;i<(isBurst?8:3);i++){
          live.stars[Math.floor(Math.random()*live.stars.length)].bright=1;
        }
      }
      for(let i=0;i<(isBurst?12:3);i++){
        live.traffic.push({x:-20-Math.random()*60,speed:1+Math.random()*3,
          color:Math.random()<.3?'#22c55e':'#4f8ff7',size:2+Math.random()*2});
      }
      live.skyHue=isBurst?20:delta>5000?35:delta>1500?180:220;
    }

    live.prevData=s;
    live.lastRefresh=Date.now();
  }catch(e){/* silent */}
}

function liveLoop(){
  if(!live.active){return;}
  live.raf=requestAnimationFrame(liveLoop);
  drawCitySkyline();
}

function drawLiveGauge(ctx,gx,gy,gr,targetPct,animVal,label,subLabel,subLabel2){
  const startA=Math.PI*0.75,endA=Math.PI*2.25;
  const range=endA-startA;
  const val=animVal;
  const needleA=startA+val*range;
  const gColor=val<0.5?'#22c55e':val<0.75?'#f59e0b':'#ef4444';

  ctx.fillStyle='#0f1117cc';ctx.beginPath();ctx.arc(gx,gy+gr,gr+18,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(gx,gy+gr,gr,startA,endA);ctx.strokeStyle='#1e2130';ctx.stroke();
  ctx.beginPath();ctx.arc(gx,gy+gr,gr,startA,needleA);
  ctx.strokeStyle=gColor;ctx.lineWidth=8;ctx.lineCap='round';ctx.stroke();
  ctx.shadowColor=gColor;ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(gx,gy+gr,gr,needleA-0.08,needleA);ctx.stroke();
  ctx.shadowBlur=0;

  const nx=gx+Math.cos(needleA)*(gr-8),ny=gy+gr+Math.sin(needleA)*(gr-8);
  ctx.beginPath();ctx.moveTo(gx,gy+gr);ctx.lineTo(nx,ny);
  ctx.strokeStyle='#eaecf4';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(gx,gy+gr,4,0,Math.PI*2);ctx.fillStyle='#eaecf4';ctx.fill();

  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=gColor;ctx.font='bold 16px Fira Code';
  ctx.fillText(Math.round(val*100)+'%',gx,gy+gr+16);
  ctx.fillStyle='#8b8fa3';ctx.font='bold 10px Fira Code';
  ctx.fillText(label,gx,gy+gr+30);
  ctx.fillStyle='#50546a';ctx.font='9px Fira Code';
  ctx.fillText(subLabel,gx,gy+gr+42);
  if(subLabel2){ctx.fillStyle='#3b4060';ctx.font='8px Fira Code';ctx.fillText(subLabel2,gx,gy+gr+54);}
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}

function drawCitySkyline(){
  const ctx=live.ctx,w=live.w,h=live.h;
  if(!ctx||w<10||h<10)return;

  // Sky gradient
  live.skyHue+=(220-live.skyHue)*0.005;
  const hue=live.skyHue;
  const sr=hue<60?Math.floor(30+hue/60*40):8;
  const sg=hue<60?Math.floor(10+hue/60*10):9+(hue>100?8:0);
  const sb=hue>100?Math.floor(13+hue/220*25):13;
  const skyGrad=ctx.createLinearGradient(0,0,0,h);
  skyGrad.addColorStop(0,`rgb(${sr},${sg},${sb})`);
  skyGrad.addColorStop(1,'#08090d');
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,w,h);

  // Stars — persistent 60, brighten green on cache hits
  live.stars.forEach(s=>{
    s.twinkle+=0.03;
    s.bright=Math.max(0,s.bright-0.015);
    const a=0.2+Math.sin(s.twinkle)*0.15+s.bright*0.6;
    ctx.beginPath();
    ctx.arc(s.x*w,s.y*h,s.bright>0.3?2.5:1,0,Math.PI*2);
    ctx.fillStyle=s.bright>0.3?`rgba(34,197,94,${a})`:`rgba(234,236,244,${a})`;
    ctx.fill();
  });

  // Ground
  const groundY=h*0.82;
  ctx.fillStyle='#0f1117';ctx.fillRect(0,groundY,w,h-groundY);
  ctx.fillStyle='#262a3a';ctx.fillRect(0,groundY,w,2);

  // Buildings — exact playground layout: full width, gap=12, bw/14 windows
  const bCount=live.buildings.length||1;
  const bw=Math.floor(w/bCount)-12;
  const gap=12;
  const maxH=h*0.65;

  live.buildings.forEach((b,i)=>{
    const bx=i*(bw+gap)+gap;
    const bh=Math.min(b.height,maxH);
    const by=groundY-bh;

    ctx.fillStyle=b.color+'40';
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle=b.color+'80';
    ctx.lineWidth=1;
    ctx.strokeRect(bx,by,bw,bh);

    // Windows — exact playground: /14 divisor
    const winCols=Math.max(2,Math.floor(bw/14));
    const winRows=Math.max(2,Math.floor(bh/14));
    for(let wy=0;wy<winRows;wy++){
      for(let wx=0;wx<winCols;wx++){
        const lit=b.windows.some(win=>Math.abs(win.y-wy/winRows)<0.15&&win.alpha>0.2);
        ctx.fillStyle=lit?b.color+'cc':'#171923';
        ctx.fillRect(bx+4+wx*(bw-8)/winCols,by+4+wy*(bh-8)/winRows,(bw-8)/winCols-2,(bh-8)/winRows-2);
      }
    }
    b.windows=b.windows.filter(win=>{win.alpha-=0.01;return win.alpha>0;});

    // Label
    ctx.fillStyle='#eaecf4';ctx.font='9px Fira Code';ctx.textAlign='center';
    ctx.fillText(b.name.slice(0,10),bx+bw/2,groundY+14);
    ctx.fillStyle=b.color;ctx.font='8px Fira Code';
    ctx.fillText(fmtCost(b.cost),bx+bw/2,groundY+26);
    ctx.textAlign='start';
  });

  // Traffic
  for(let i=live.traffic.length-1;i>=0;i--){
    const t=live.traffic[i];
    t.x+=t.speed;
    if(t.x>w+20){live.traffic.splice(i,1);continue;}
    ctx.beginPath();ctx.arc(t.x,groundY+40+Math.sin(t.x*0.05)*3,t.size,0,Math.PI*2);
    ctx.fillStyle=t.color+'aa';ctx.fill();
  }

  // ── Gauge 1: Billing Period (top-right) ──
  const g1x=w-90,g1y=10,g1r=42;
  live.gaugeAnim+=(live.stats.billingPct/100-live.gaugeAnim)*0.06;
  drawLiveGauge(ctx,g1x,g1y,g1r,live.stats.billingPct,live.gaugeAnim,
    'BILLING',live.stats.billingLabel);

  // ── Gauge 2: 5-Hour Window (below billing gauge) ──
  const g2x=w-90,g2y=g1y+g1r*2+56,g2r=42;
  live.gauge5hAnim+=(live.stats.window5hPct/100-live.gauge5hAnim)*0.06;
  drawLiveGauge(ctx,g2x,g2y,g2r,live.stats.window5hPct,live.gauge5hAnim,
    '5H WINDOW',live.stats.window5hRemain);
  // Reset hour — big and prominent below the gauge
  if(live.stats.window5hResetLabel){
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#f59e0b';ctx.font='bold 14px Fira Code';
    ctx.fillText(live.stats.window5hResetLabel,g2x,g2y+g2r+62);
    ctx.textAlign='start';ctx.textBaseline='alphabetic';
  }

  // ── Stats Bar (bottom) ──
  const barH=48,barY=h-barH;
  ctx.fillStyle='#0f1117dd';ctx.fillRect(0,barY,w,barH);
  ctx.fillStyle='#262a3a';ctx.fillRect(0,barY,w,1);

  const statItems=[
    {label:'TOK/SEC',value:fmt(live.stats.rate),color:'#f59e0b'},
    {label:'TOKENS',value:fmtTokens(live.stats.totalTokens),color:'#4f8ff7'},
    {label:'COST',value:fmtCost(live.stats.cost),color:'#22c55e'},
    {label:'CACHE',value:live.stats.cacheRate.toFixed(0)+'%',color:'#06b6d4'},
    {label:'MODEL',value:(live.stats.model||'').replace('claude-','').slice(0,12),color:'#a855f7'},
    {label:'MSGS',value:fmt(live.stats.msgs),color:'#ec4899'},
    {label:'INPUT',value:fmtTokens(live.stats.input),color:'#4f8ff7'},
    {label:'OUTPUT',value:fmtTokens(live.stats.output),color:'#a855f7'},
  ];
  const statW=w/statItems.length;
  statItems.forEach((s,i)=>{
    const sx=i*statW+12;
    ctx.fillStyle=s.color;ctx.font='bold 13px Fira Code';
    ctx.fillText(s.value,sx,barY+20);
    ctx.fillStyle='#50546a';ctx.font='8px Fira Code';
    ctx.fillText(s.label,sx,barY+34);
  });

  // ── Sparkline (top-left) ──
  ctx.fillStyle='#0f1117aa';ctx.fillRect(12,12,180,52);
  ctx.fillStyle='#50546a';ctx.font='8px Fira Code';ctx.fillText('TOKEN RATE',20,26);
  ctx.fillStyle='#f59e0b';ctx.font='bold 12px Fira Code';ctx.fillText(fmt(live.stats.rate)+'/s',100,26);
  ctx.beginPath();ctx.strokeStyle='#f59e0b88';ctx.lineWidth=1.5;
  const spLen=Math.min(live.rateIdx,200);
  const spMax=Math.max(1,...Array.from(live.rateHist));
  for(let si=0;si<spLen;si++){
    const idx=(live.rateIdx-spLen+si+200)%200;
    const v=live.rateHist[idx]/spMax;
    const px=20+si*(160/200);
    const py=55-v*22;
    si===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();

  // Live indicator
  const pulse=0.5+Math.sin(Date.now()*0.004)*0.5;
  ctx.beginPath();ctx.arc(w-20,h-barH-16,4,0,Math.PI*2);
  ctx.fillStyle=`rgba(34,197,94,${0.3+pulse*0.7})`;ctx.fill();
  ctx.fillStyle='#50546a';ctx.font='9px Fira Code';
  ctx.fillText('LIVE',w-50,h-barH-12);
  ctx.fillStyle='#262a3a';ctx.font='8px Fira Code';
  ctx.fillText(live.stats.projects+' projects',w-110,h-barH-12);
}

// ── FEATURE 12: Cost Simulator ──────────────────
async function renderSimulator(){
    const app=document.getElementById('simulator-app');
    app.innerHTML='<div class="loading"><div class="spinner"></div>Loading simulator...</div>';
    try{
    const[data,pricingRes]=await Promise.all([loadData(),fetch('/api/pricing').then(r=>r.json()).catch(()=>null)]);
    const mu=data.modelUsage||{};const models=Object.entries(mu).filter(([k])=>k!=='<synthetic>');
    const totalCost=models.reduce((s,[,v])=>s+(v.cost||0),0);
    const totalTokens=models.reduce((s,[,v])=>s+(v.inputTokens||0)+(v.outputTokens||0),0);
    const s=data.summary;
    const cacheRead=s.totalCacheRead||0;const totalIn=(s.totalInputTokens||0)+cacheRead;
    const currentCacheRate=totalIn>0?(cacheRead/totalIn*100):0;

    // Find the most expensive model and a cheaper alternative
    const sorted=models.sort(([,a],[,b])=>(b.cost||0)-(a.cost||0));
    const expensiveModel=sorted[0]?sorted[0][0]:'N/A';
    const expensiveCost=sorted[0]?sorted[0][1].cost||0:0;
    const cheapModel=sorted.length>1?sorted[sorted.length-1][0]:'N/A';
    // Estimate savings ratio: cheaper model typically costs ~10-30% of expensive
    const cheapRatio=sorted.length>1&&sorted[0][1].cost>0?(sorted[sorted.length-1][1].cost/Math.max(1,sorted[sorted.length-1][1].messages||1))/((sorted[0][1].cost)/Math.max(1,sorted[0][1].messages||1)):0.2;

    app.innerHTML=`
        <div class="card" style="margin-bottom:16px">
            <div class="card-header">What-If Cost Simulator</div>
            <p style="color:var(--text-2);font-size:12px;margin-bottom:18px">Drag the sliders to see how changes would affect your costs. Results update live.</p>
            <div class="bento" style="margin-bottom:0">
                <div class="card span-6">
                    <div class="card-header">Model Mix Shift</div>
                    <p style="font-size:11px;color:var(--text-3);margin-bottom:12px">What if <strong style="color:var(--orange)">${escHtml(expensiveModel.replace('claude-',''))}</strong> usage moved to <strong style="color:var(--green)">${escHtml(cheapModel.replace('claude-',''))}</strong>?</p>
                    <div class="sim-slider-wrap">
                        <label>Shift percentage: <strong id="sim-model-val">0</strong>%</label>
                        <input type="range" id="sim-model-slider" min="0" max="100" value="0">
                    </div>
                    <div class="sim-result">
                        <div class="sim-card"><div class="sv" style="color:var(--text-2)" id="sim-model-current">${fmtCost(totalCost)}</div><div class="sl">Current Cost</div></div>
                        <div class="sim-card"><div class="sv" style="color:var(--green)" id="sim-model-projected">${fmtCost(totalCost)}</div><div class="sl">Projected Cost</div></div>
                        <div class="sim-card"><div class="sv" style="color:var(--orange)" id="sim-model-savings">$0.00</div><div class="sl">Savings</div></div>
                    </div>
                </div>
                <div class="card span-6">
                    <div class="card-header">Cache Improvement</div>
                    <p style="font-size:11px;color:var(--text-3);margin-bottom:12px">Current cache hit rate: <strong style="color:var(--cyan)">${currentCacheRate.toFixed(1)}%</strong></p>
                    <div class="sim-slider-wrap">
                        <label>Improve cache rate by: <strong id="sim-cache-val">0</strong>%</label>
                        <input type="range" id="sim-cache-slider" min="0" max="${Math.floor(100-currentCacheRate)}" value="0">
                    </div>
                    <div class="sim-result">
                        <div class="sim-card"><div class="sv" style="color:var(--text-2)" id="sim-cache-current">${fmtCost(totalCost)}</div><div class="sl">Current Cost</div></div>
                        <div class="sim-card"><div class="sv" style="color:var(--green)" id="sim-cache-projected">${fmtCost(totalCost)}</div><div class="sl">Projected Cost</div></div>
                        <div class="sim-card"><div class="sv" style="color:var(--orange)" id="sim-cache-savings">$0.00</div><div class="sl">Savings</div></div>
                    </div>
                </div>
            </div>
        </div>`;

    // Slider handlers
    const modelSlider=document.getElementById('sim-model-slider');
    const cacheSlider=document.getElementById('sim-cache-slider');
    modelSlider.addEventListener('input',function(){
        const pct=parseInt(this.value)/100;
        document.getElementById('sim-model-val').textContent=this.value;
        const shifted=expensiveCost*pct;
        const savings=shifted*(1-cheapRatio);
        const projected=totalCost-savings;
        document.getElementById('sim-model-projected').textContent=fmtCost(Math.max(0,projected));
        document.getElementById('sim-model-savings').textContent=fmtCost(savings);
    });
    cacheSlider.addEventListener('input',function(){
        const improvement=parseInt(this.value)/100;
        document.getElementById('sim-cache-val').textContent=this.value;
        // Cache reads are ~10x cheaper than fresh input. More cache = less fresh input cost.
        // Approximate: each 1% cache improvement saves ~0.9% of input cost
        const inputCostFraction=0.6; // input is roughly 60% of total cost
        const savings=totalCost*inputCostFraction*improvement*0.9;
        const projected=totalCost-savings;
        document.getElementById('sim-cache-projected').textContent=fmtCost(Math.max(0,projected));
        document.getElementById('sim-cache-savings').textContent=fmtCost(savings);
    });
    }catch(e){app.innerHTML='<div class="card" style="padding:48px;text-align:center;color:var(--text-3)">Could not load simulator data.</div>';}
}

// ── FEATURE 15: Subagent Cost Tree ──────────────
async function renderSubagentTree(container){
    try{
        const tree=await(await fetch('/api/subagent-tree')).json();
        if(!tree||!tree.length)return;
        const maxCost=Math.max(1,...tree.map(t=>t.total_cost||0));
        let html='<div class="card" style="margin-top:16px"><div class="card-header">Subagent Cost Tree ${tip(TIPS.subTree)}</div>';
        tree.slice(0,20).forEach(session=>{
            const barW=Math.max(2,((session.total_cost||0)/maxCost)*100);
            html+=`<div class="tree-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
                <span style="color:var(--text-3);font-size:10px">&#9654;</span>
                <span class="mono" style="color:var(--blue)">${escHtml((session.project_name||'Session').slice(0,30))}</span>
                <span class="mono" style="color:var(--text-2);font-size:10px">${fmtCost(session.total_cost||0)}</span>
                <span class="tree-cost-bar" style="width:${barW}%"></span>
            </div>`;
            html+='<div class="tree-node" style="display:none">';
            if(session.subagents&&session.subagents.length){
                session.subagents.forEach(sub=>{
                    const subBarW=Math.max(2,((sub.total_cost||0)/maxCost)*100);
                    html+=`<div style="font-size:11px;padding:3px 0;display:flex;align-items:center;gap:8px">
                        <span class="mono" style="color:var(--purple)">${escHtml(sub.slug||sub.agent_id||'agent')}</span>
                        <span class="mono" style="color:var(--text-3)">${sub.message_count||0} msgs</span>
                        <span class="mono" style="color:var(--orange)">${fmtCost(sub.total_cost||0)}</span>
                        <span class="tree-cost-bar" style="width:${subBarW}%"></span>
                    </div>`;
                });
            }else{
                html+='<div style="font-size:11px;color:var(--text-3);padding:3px 0">No subagents</div>';
            }
            html+='</div>';
        });
        html+='</div>';
        container.insertAdjacentHTML('beforeend',html);
    }catch(e){/* silent — endpoint may not exist yet */}
}

// ── FEATURE 16: Session Bookmarks ───────────────
async function bookmarkSession(sessionId){
    try{
        await fetch('/api/bookmarks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId})});
        showToast('Session bookmarked');
    }catch(e){showToast('Failed to bookmark');}
}
async function removeBookmark(sessionId){
    try{
        await fetch('/api/bookmarks/'+encodeURIComponent(sessionId),{method:'DELETE'});
        showToast('Bookmark removed');
        renderSessions();
    }catch(e){showToast('Failed to remove bookmark');}
}

// ── FEATURE 17: Keyboard Shortcuts ──────────────
document.addEventListener('keydown',function(e){
    // Skip if user is typing in an input/select/textarea
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
    const tabKeys=['live','overview','sessions','tools','git','project','insights','simulator'];
    if(e.key>='1'&&e.key<='8'){
        const idx=parseInt(e.key)-1;
        if(idx<tabKeys.length){
            const nav=document.querySelector('.nav-item[data-tab="'+tabKeys[idx]+'"]');
            if(nav)nav.click();
        }
        return;
    }
    if(e.key==='?'){document.getElementById('shortcuts-modal').classList.add('open');return;}
    if(e.key==='r'&&!e.metaKey&&!e.ctrlKey){regenerate();return;}
    if(e.key==='Escape'){
        document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));
        return;
    }
});
document.getElementById('shortcuts-modal').addEventListener('click',function(e){if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});

// ── Helpers ──────────────────────────────────────
function el(id){return document.getElementById(id).getContext('2d');}
function escHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function escAttr(s){if(!s)return'';return s.replace(/[&'"<>]/g,c=>({'&':'&amp;',"'":'&#39;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]));}

// ── Init ─────────────────────────────────────────
loadAndRender().catch(err=>{document.getElementById('overview-app').innerHTML=`<div class="loading" style="flex-direction:column;gap:12px"><div style="color:var(--red)">Failed to load</div><div style="font-size:12px;color:var(--text-3)">${err.message}</div></div>`;});
</script>
